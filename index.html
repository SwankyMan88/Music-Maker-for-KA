<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Songboard</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background: rgb(23, 25, 31);
                color: rgb(221, 224, 231);
                font: 13px system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                user-select: none;
            }
            button, select, input {
                font: inherit;
                color: inherit;
            }
            button {
                background: rgb(41, 45, 55);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 5px;
                padding: 4px 9px;
                cursor: pointer;
            }
            button:hover {
                background: rgb(51, 56, 68);
            }
            button.on {
                background: rgb(43, 88, 124);
                border-color: rgb(97, 183, 246);
            }
            button.hi {
                background: rgb(97, 183, 246);
                border-color: rgb(97, 183, 246);
                color: rgb(17, 22, 31);
                font-weight: 600;
            }
            select, input[type="number"], input[type="text"], input:not([type]) {
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 5px;
                padding: 3px 6px;
            }
            input[type="range"] {
                accent-color: rgb(97, 183, 246);
            }
            label {
                display: flex;
                align-items: center;
                gap: 5px;
                color: rgb(141, 148, 163);
            }

            #top {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                background: rgb(30, 33, 40);
                border-bottom: 1px solid rgb(48, 53, 64);
                flex-wrap: wrap;
            }
            .logo {
                font-weight: 700;
                font-size: 15px;
                letter-spacing: 0.3px;
                margin-right: 6px;
                color: rgb(97, 183, 246);
            }
            #playBtn {
                width: 38px;
            }
            #clock {
                font-variant-numeric: tabular-nums;
                background: rgb(19, 21, 26);
                border-radius: 5px;
                padding: 4px 9px;
                min-width: 128px;
                text-align: center;
                color: rgb(171, 232, 151);
            }
            .tag {
                font-size: 11px;
                padding: 3px 7px;
                border-radius: 10px;
                background: rgb(41, 45, 55);
                color: rgb(141, 148, 163);
            }
            .tag.ok {
                background: rgb(43, 74, 52);
                color: rgb(171, 232, 151);
            }
            .tag.off {
                background: rgb(84, 62, 38);
                color: rgb(244, 203, 87);
            }
            #bpm {
                width: 58px;
            }
            #title {
                width: 170px;
            }
            .grow {
                flex: 1;
            }
            #more {
                display: contents;
            }
            .grp2 {
                display: flex;
                align-items: center;
                gap: 5px;
                padding-left: 9px;
                border-left: 1px solid rgb(55, 61, 73);
            }
            .cap {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: rgb(121, 128, 143);
            }
            #helpBtn {
                width: 30px;
                border-radius: 50%;
                padding: 4px 0;
            }
            body.single .grp2 {
                border-left: none;
                padding-left: 0;
                flex-wrap: wrap;
            }
            .help h3 {
                font-size: 13px;
                margin: 12px 0 4px;
                color: rgb(221, 224, 231);
            }
            .help ul {
                margin: 0;
                padding-left: 18px;
            }
            .help li {
                margin: 3px 0;
            }
            .small {
                display: none;
            }
            .sideHd {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .sideHd button {
                padding: 1px 7px;
                font-size: 12px;
            }

            /* Single view: small screens (like a Khan Academy page) show one pane at a time. */
            /* The top bar picks the pane and track, the rest of the controls live in the menu. */
            body.single #top {
                position: relative;
                flex-wrap: nowrap;
                gap: 6px;
                padding: 6px 8px;
            }
            body.single .small {
                display: block;
            }
            body.single .logo {
                display: none;
            }
            body.single #trackSel {
                min-width: 0;
                max-width: 150px;
            }
            body.single #more {
                display: none;
                position: absolute;
                top: 100%;
                right: 6px;
                z-index: 25;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                width: min(260px, calc(100vw - 12px));
                max-height: calc(100vh - 60px);
                overflow-y: auto;
                padding: 10px;
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            body.single.menu #more {
                display: flex;
            }
            body.single #more .grow {
                display: none;
            }
            body.single #title {
                width: auto;
            }
            body.single #side,
            body.single .corner,
            body.single #heads {
                width: 196px;
            }
            body.single #split {
                display: none;
            }
            body.single[data-view="tracks"] #side,
            body.single[data-view="tracks"] #rollBar,
            body.single[data-view="tracks"] #rollWrap,
            body.single[data-view="notes"] #side,
            body.single[data-view="notes"] #arr,
            body.single[data-view="sounds"] #work {
                display: none;
            }
            body.single[data-view="tracks"] #arr {
                flex: 1;
                height: auto !important;
            }
            body.single[data-view="sounds"] #side {
                width: 100%;
                border-right: none;
            }
            body.single #rollBar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 5px 8px;
            }
            body.single #rollName,
            body.single #rollBar label {
                display: none;
            }
            body.single .sec {
                margin-left: 0;
            }
            body.single .hd .vo {
                width: 34px;
            }
            body.single .hd .pa {
                display: none;
            }
            body.single .hd .is {
                width: 64px;
            }

            #main {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            #side {
                width: 184px;
                background: rgb(27, 30, 37);
                border-right: 1px solid rgb(48, 53, 64);
                overflow-y: auto;
                padding-bottom: 12px;
            }
            .sideHd {
                padding: 9px 10px 4px;
                font-weight: 600;
            }
            .grp {
                padding: 8px 10px 3px;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: rgb(121, 128, 143);
            }
            .pi {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 10px;
                cursor: grab;
            }
            .pi:hover {
                background: rgb(37, 41, 50);
            }
            .pi.on {
                background: rgb(39, 57, 76);
            }
            .sw {
                width: 10px;
                height: 10px;
                border-radius: 3px;
                flex: none;
            }
            .tip {
                padding: 10px;
                color: rgb(121, 128, 143);
                font-size: 12px;
                line-height: 1.4;
            }

            #work {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            #arr {
                height: 36%;
                min-height: 24px;
                display: flex;
                flex-direction: column;
            }
            #arrTop {
                display: flex;
                height: 24px;
                flex: none;
            }
            .corner {
                width: 250px;
                flex: none;
                background: rgb(31, 34, 41);
                border-right: 1px solid rgb(48, 53, 64);
                border-bottom: 1px solid rgb(48, 53, 64);
                display: flex;
                align-items: center;
                padding: 0 6px;
            }
            .corner button {
                padding: 0 8px;
                font-size: 12px;
            }
            #ruler {
                flex: 1;
                min-width: 0;
                height: 24px;
                cursor: text;
            }
            #arrBody {
                flex: 1;
                display: flex;
                overflow-y: auto;
                overflow-x: hidden;
                align-items: flex-start;
            }
            #heads {
                width: 250px;
                flex: none;
                background: rgb(29, 32, 39);
                border-right: 1px solid rgb(48, 53, 64);
            }
            #lanes {
                flex: 1;
                min-width: 0;
                display: block;
            }
            .hd {
                height: 56px;
                display: flex;
                border-bottom: 1px solid rgb(41, 45, 54);
                cursor: pointer;
            }
            .hd.on {
                background: rgb(36, 44, 56);
            }
            .strip {
                width: 6px;
                flex: none;
            }
            .hm {
                flex: 1;
                min-width: 0;
                padding: 5px 6px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .r1, .r2 {
                display: flex;
                align-items: center;
                gap: 3px;
            }
            .nm {
                flex: 1;
                min-width: 0;
                background: transparent !important;
                border: 1px solid transparent !important;
                font-weight: 600;
                padding: 1px 3px !important;
            }
            .nm:focus {
                border-color: rgb(55, 61, 73) !important;
            }
            .r1 button {
                padding: 0 5px;
                font-size: 11px;
                height: 19px;
            }
            .mb.on {
                background: rgb(160, 72, 66);
                border-color: rgb(228, 93, 82);
            }
            .sb.on {
                background: rgb(150, 122, 46);
                border-color: rgb(244, 203, 87);
            }
            .is {
                width: 118px;
                padding: 1px 3px !important;
                font-size: 12px;
            }
            .vo {
                width: 54px;
            }
            .pa {
                width: 36px;
            }
            .grip {
                width: 14px;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgb(101, 108, 123);
                cursor: grab;
                touch-action: none;
            }
            .grip:hover {
                color: rgb(221, 224, 231);
            }
            .hd.dropUp {
                box-shadow: inset 0 2px 0 rgb(97, 183, 246);
            }
            .hd.dropDown {
                box-shadow: inset 0 -2px 0 rgb(97, 183, 246);
            }
            .hdAdd:hover {
                color: rgb(221, 224, 231);
                background: rgb(36, 40, 49);
            }
            .hdAdd {
                cursor: pointer;
                height: 56px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgb(101, 108, 123);
                font-size: 12px;
                border-bottom: 1px dashed rgb(48, 53, 64);
            }
            .drop {
                outline: 2px dashed rgb(97, 183, 246);
                outline-offset: -2px;
            }

            #split {
                height: 14px;
                background: rgb(36, 40, 49);
                border-top: 1px solid rgb(48, 53, 64);
                border-bottom: 1px solid rgb(48, 53, 64);
                cursor: ns-resize;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            #split::before {
                content: "";
                width: 42px;
                height: 4px;
                border-radius: 2px;
                background: rgb(72, 79, 94);
            }
            #split button {
                padding: 0 6px;
                height: 12px;
                font-size: 8px;
                line-height: 1;
            }
            #rollBar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 5px 10px;
                background: rgb(30, 33, 40);
                border-bottom: 1px solid rgb(48, 53, 64);
                flex: none;
            }
            #rollName {
                font-weight: 600;
                min-width: 120px;
            }
            #vel {
                width: 90px;
            }
            #rollWrap {
                flex: 1;
                position: relative;
                min-height: 0;
            }
            #roll {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
            #lyric {
                position: absolute;
                display: none;
                z-index: 5;
                height: 22px;
                background: rgb(255, 247, 216) !important;
                color: rgb(31, 29, 34) !important;
                border: 2px solid rgb(252, 141, 211) !important;
                border-radius: 4px;
                font-weight: 600;
                padding: 0 4px !important;
                outline: none;
            }
            #lyric.show {
                display: block;
            }

            .sec {
                display: flex;
                gap: 4px;
                margin-left: auto;
            }
            .visPick {
                margin-bottom: 4px;
            }
            #expSongs {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 14px;
                margin: 6px 0 8px;
            }
            #expSongs label {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            #stage {
                position: fixed;
                inset: 0;
                z-index: 30;
                background: rgb(21, 23, 29);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }
            .stageBar {
                display: flex;
                gap: 8px;
            }
            #stage.hide {
                display: none;
            }
            #stageCv {
                width: min(92vw, calc(100vh - 90px));
                height: min(92vw, calc(100vh - 90px));
                border-radius: 10px;
                cursor: pointer;
            }
            canvas {
                touch-action: none;
            }
            .mob {
                display: none;
            }
            body.mobile .mob {
                display: block;
            }
            .mob.on {
                background: rgb(160, 72, 66);
                border-color: rgb(228, 93, 82);
            }
            .hd.pick {
                background: rgb(46, 58, 78);
                box-shadow: inset 0 0 0 1px rgb(97, 183, 246);
            }
            #edit {
                position: fixed;
                inset: 0;
                background: rgba(9, 10, 14, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 22;
            }
            #edit.hide {
                display: none;
            }
            .ebox {
                width: min(760px, calc(100% - 20px));
                max-height: calc(100vh - 30px);
                display: flex;
                flex-direction: column;
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 10px;
                box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
            }
            .etop, .ebot {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .etop {
                border-bottom: 1px solid rgb(48, 53, 64);
            }
            .ebot {
                border-top: 1px solid rgb(48, 53, 64);
            }
            #eTitle {
                font-weight: 700;
                font-size: 15px;
                flex: 1;
                min-width: 140px;
            }
            .etabs {
                display: flex;
                gap: 4px;
            }
            #eWords {
                flex: 1;
                min-width: 120px;
            }
            #eBody {
                overflow-y: auto;
                padding: 12px 14px;
            }
            .knob {
                display: grid;
                grid-template-columns: 130px 1fr 52px;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }
            .knob span:last-child {
                text-align: right;
                color: rgb(171, 177, 191);
                font-variant-numeric: tabular-nums;
            }
            .note {
                color: rgb(141, 148, 163);
                margin: 2px 0 12px;
                line-height: 1.4;
            }
            .graphs {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 8px;
                margin-bottom: 10px;
            }
            .graphs canvas {
                width: 100%;
                height: 110px;
                background: rgb(20, 22, 27);
                border-radius: 6px;
            }
            .layer {
                border: 1px solid rgb(48, 53, 64);
                border-radius: 8px;
                padding: 8px 10px;
                margin-bottom: 8px;
            }
            .layer .lhead {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 6px;
                font-weight: 600;
            }
            .fields {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 6px 10px;
            }
            .fields label {
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
                font-size: 11px;
            }
            .fields input, .fields select {
                width: 100%;
                padding: 2px 5px !important;
            }
            .slot {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 0;
                border-bottom: 1px solid rgb(48, 53, 64);
            }
            .slot b {
                flex: 1;
            }
            .slot span {
                color: rgb(141, 148, 163);
                font-size: 12px;
            }
            #modal {
                position: fixed;
                inset: 0;
                background: rgba(9, 10, 14, 0.66);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 20;
            }
            #modal.hide {
                display: none;
            }
            .box {
                width: min(720px, calc(100% - 32px));
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 10px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
            }
            #mTitle {
                font-size: 16px;
                font-weight: 700;
            }
            #mText {
                color: rgb(171, 177, 191);
                line-height: 1.45;
            }
            #mText .warn {
                color: rgb(244, 203, 87);
            }
            #mArea {
                width: 100%;
                height: 260px;
                resize: vertical;
                background: rgb(20, 22, 27);
                color: rgb(206, 226, 196);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 6px;
                padding: 8px;
                font: 12px ui-monospace, Consolas, monospace;
                word-break: break-all;
                user-select: text;
            }
            #mBtns {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
        </style>
    </head>
    <body>
        <div id="top">
            <div class="logo">Songboard</div>
            <button id="playBtn" title="Play / Stop (Space)">▶</button>
            <select id="viewSel" class="small" title="Which pane to show">
                <option value="tracks">Tracks</option>
                <option value="notes">Notes</option>
                <option value="sounds">Sounds</option>
            </select>
            <select id="trackSel" class="small" title="Track to edit"></select>
            <div class="grow small"></div>
            <button id="menuBtn" class="small" title="Song menu">☰</button>
            <button id="fullBtn" title="Open in a full window">⛶</button>
            <div id="more">
                <div class="grp2">
                    <button id="homeBtn" title="Back to the start (Home)">⏮</button>
                    <button id="loopBtn" title="Loop (L). Drag on the ruler to pick a section, otherwise the whole song loops.">Loop</button>
                    <button id="followBtn" class="on" title="Scroll along with the playhead">Follow</button>
                    <div id="clock" title="Bar.beat.step and time">1.1.1 · 0:00.0</div>
                    <span id="voiceTag" class="tag">Voice...</span>
                </div>
                <div class="grp2">
                    <label title="Speed in beats per minute">BPM <input id="bpm" type="number" min="20" max="400" value="120"></label>
                    <label title="What notes and the ruler snap to">Snap
                    <select id="snap">
                        <option value="48">Bar</option>
                        <option value="12">1/4</option>
                        <option value="6">1/8</option>
                        <option value="3" selected>1/16</option>
                        <option value="4">1/8 T</option>
                        <option value="2">1/16 T</option>
                        <option value="1">Off</option>
                    </select>
                    </label>
                </div>
                <div class="grp2" title="The song you are editing">
                    <span class="cap">Song</span>
                    <select id="songSel" title="Songs in this page"></select>
                    <input id="title" type="text" placeholder="Song title" maxlength="60">
                    <button id="songDel" title="Remove this song from the list">✕</button>
                </div>
                <div class="grow"></div>
                <div class="grp2">
                    <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
                    <button id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
                </div>
                <div class="grp2">
                    <button id="newBtn" title="Start a new song in the list">New</button>
                    <button id="saveBtn" title="Save songs in this browser">Save</button>
                    <button id="impBtn" title="Bring in song text">Import</button>
                </div>
                <div class="grp2">
                    <span class="cap">Export</span>
                    <button id="expBtn" title="Song text to keep or share">Text</button>
                    <button id="pageBtn" title="A page that only plays your songs with their visuals">Player</button>
                    <button id="pjsBtn" class="hi" title="A Processing.js program for Khan Academy">PJS</button>
                </div>
                <button id="helpBtn" title="How everything works">?</button>
            </div>
        </div>

        <div id="main">
            <div id="side">
                <div class="sideHd">Instruments <button id="sideAdd" title="Add a track with the picked instrument">+ Track</button></div>
                <div id="pal"></div>
                <div class="tip">Click to hear one. Drag it onto the board to make a track, or onto a track to swap its sound. Double-click also adds a track.</div>
            </div>

            <div id="work">
                <div id="arr">
                    <div id="arrTop">
                        <div class="corner"></div>
                        <canvas id="ruler"></canvas>
                    </div>
                    <div id="arrBody">
                        <div id="heads"></div>
                        <canvas id="lanes"></canvas>
                    </div>
                </div>
                <div id="split" title="Drag to resize"><button id="splitUp" title="Bigger piano roll">▲</button><button id="splitDown" title="Bigger track view">▼</button></div>
                <div id="rollBar">
                    <span id="rollName">-</span>
                    <label>Velocity <input id="vel" type="range" min="1" max="127" value="100"></label>
                    <button id="lyrBtn" title="Type a line of lyrics and spread it across notes">Fill lyrics</button>
                    <button id="trashBtn" class="mob" title="Tap notes to delete them">🗑 Delete mode</button>
                    <div class="sec" title="Works on selected notes, or on the section picked on the ruler">
                        <button id="copyBtn" title="Ctrl+C">Copy</button>
                        <button id="pasteBtn" title="Ctrl+V, pastes at the playhead">Paste</button>
                        <button id="dupBtn" title="Ctrl+D">Duplicate</button>
                        <button id="delBtn" title="Delete">Delete</button>
                    </div>
                </div>
                <div id="rollWrap">
                    <canvas id="roll"></canvas>
                    <input id="lyric" type="text" spellcheck="false" autocomplete="off">
                </div>
            </div>
        </div>

        <div id="stage" class="hide">
            <canvas id="stageCv" width="600" height="600"></canvas>
            <div class="stageBar">
                <select id="stageSong" title="Pick a song"></select>
                <button id="stageBtn">Open in editor</button>
            </div>

var tests = [];

var stopTests = function () {
    tests.forEach(function (src) {
        try {
            src.stop();
        } catch (er) {
            src.onended = null;
        }
    });
    tests = [];
    $("eTest").textContent = "▶ Test";
};

var addTest = function (src) {
    if (!src) { return; }
    tests.push(src);
    $("eTest").textContent = "■ Stop";
    src.addEventListener("ended", function () {
        tests = tests.filter(function (t) { return t !== src; });
        if (!tests.length) { $("eTest").textContent = "▶ Test"; }
    });
};

var mixAll = function () {
    var solo = anySolo();
    song.tracks.forEach(function (tr) {
        var b = bus(tr);
        var on = !tr.mute && (!solo || tr.solo);
        b.g.gain.setTargetAtTime(on ? tr.vol / 100 : 0, ctx.currentTime, 0.01);
        (b.fx ? b.in.out : b.in).pan.value = tr.pan / 50;
    });
};

// How a note bends and how long it sounds once joined notes are taken into account.
var bendOf = function (tr, n) {
    ord(tr);
    var b = n._bend;
    return b ? { len: b.len, gl: b.gl ? core.secs(b.gl, spt()) : null } : null;
};

// Every joined pair on a track, as [from, to].
var links = function (tr) {
    ord(tr);
    var out = [];
    tr._in.forEach(function (gi, to) { out.push([gi.from, to]); });
    return out;
};

// After notes move, joins follow the notes they were made between. A join that ends up going backwards is dropped.
var relink = function (pairs, last) {
    pairs.forEach(function (pr) {
        var a = pr[0], b = pr[1];
        if (!a.g) { return; }
        if (b.t > a.t) {
            a.g.dt = b.t - a.t;
            a.g.dp = b.p - a.p;
        } else if (last) {
            delete a.g;
        }
    });
    bump();
};

var keep = function (key, make, peek) {
    if (bufs[key] === undefined) {
        if (peek) { return null; }
        if (bufCount++ > 3000) {
            bufs = {};
            bufCount = 0;
        }
        bufs[key] = make();
    }
    return bufs[key];
};

var prevWord = function (tr, n) {
    var list = ord(tr);
    for (var i = list.indexOf(n) - 1; i >= 0; i--) {
        if (!voice.held(list[i].w)) { return list[i].w; }
    }
    return "";
};

// Sounds of a track with an edited instrument are kept apart from the preset's.
var insKey = function (tr) {
    if (!tr.x || !tr.x.ins) { return ""; }
    if (!tr._ik) { tr._ik = "c" + core.hash(JSON.stringify(tr.x.ins)) + ":"; }
    return tr._ik;
};

// A voice track's settings: the preset's, with the track's own edits on top.
var voxOf = function (tr) {
    var vx = {}, a = insOf(tr).vx || {}, b = (tr.x && tr.x.vx) || {};
    Object.keys(a).forEach(function (k) { vx[k] = a[k]; });
    Object.keys(b).forEach(function (k) { vx[k] = b[k]; });
    return vx;
};

var getBuf = function (tr, n, sec, peek) {
    var ins = insOf(tr), bent = bendOf(tr, n), gl = bent && bent.gl;
    if (bent) { sec = bent.len * spt(); }
    if (ins.k === "vox") {
        if (!window.voice) { return null; }
        var vx = voxOf(tr), list = ord(tr), p = n.p;
        if (gl) { vx.gl = gl; }
        var pw = voice.held(n.w) ? prevWord(tr, n) : "";
        var ch = vx.hd ? voice.chain(list, n) : null;
        var key = "v" + tr.inst + JSON.stringify((tr.x && tr.x.vx) || 0) + ":" + n.w + ":" + pw + ":" + (ch ? ch.word + ch.part : "") + ":" + (voice.big ? 1 : 0);
        return keep(key + ":" + p + ":" + Math.round(sec * 1000) + JSON.stringify(gl), function () {
            return voice.render(ctx, n.w, p, sec, pw, vx, list, n);
        }, peek);
    }
    var sk = synthOf(tr, n, sec);
    return keep(sk.key, function () {
        return { buf: core.render(ctx, ins, n.p, sk.sec, gl), pre: 0 };
    }, peek);
};

// Everything needed to build an instrument note (not a voice): its key in the sound store and how to make it.
var synthOf = function (tr, n, sec) {
    var ins = insOf(tr), bent = bendOf(tr, n), gl = bent && bent.gl;
    if (ins.k === "vox") { return null; }
    if (bent) { sec = bent.len * spt(); }
    return { key: insKey(tr) + core.key(tr.inst, n.p, sec, ins) + (gl ? JSON.stringify(gl) : ""), ins: ins, sec: sec, gl: gl };
};

// Sounds are built a little at a time.
// Khan Academy stops any script that keeps looping for too long in one go, so nothing here runs for more than ~25ms at once.
var warm = { list: [], at: 0, timer: 0, wait: null };

var warmUp = function (from, ready) {
    var list = [];
    song.tracks.forEach(function (tr) {
        tr.notes.forEach(function (n) {
            if (n.t + n.l > from) { list.push({ tr: tr, n: n }); }
        });
    });
    list.sort(function (a, b) { return a.n.t - b.n.t; });
    clearTimeout(warm.timer);
    warm.list = list;
    warm.at = 0;
    warm.job = null;
    warm.wait = { until: from + 2 / spt(), fn: ready };
    warmStep();
};

var warmStep = function () {
    var t0 = performance.now();
    while (warm.at < warm.list.length && performance.now() - t0 < 25) {
        var w = warm.list[warm.at];
        if (!warm.job) {
            var sk = synthOf(w.tr, w.n, w.n.l * spt());
            if (!sk || bufs[sk.key] !== undefined) {
                getBuf(w.tr, w.n, w.n.l * spt());
                warm.at++;
                continue;
            }
            warm.job = { key: sk.key, r: core.job(ctx, sk.ins, w.n.p, sk.sec, sk.gl) };
        }
        // long notes are built a piece at a time and carry on in the next step
        if (warm.job.r.step(3000)) {
            var made = warm.job.r.buf;
            keep(warm.job.key, function () { return { buf: made, pre: 0 }; });
            warm.job = null;
            warm.at++;
        }
    }
    var w2 = warm.list[warm.at];
    if (warm.wait && (!w2 || w2.n.t > warm.wait.until)) {
        var fn = warm.wait.fn;
        warm.wait = null;
        fn();
    }
    if (warm.at < warm.list.length) { warm.timer = setTimeout(warmStep, 5); }
    if (warm.wait) { $("playBtn").textContent = Math.round(warm.at / Math.max(1, warm.list.length) * 100) + "%"; }
};

// Plays a short test of a preset (by number) or of a track, with the track's own sound and effects.
var preview = function (src, p, w) {
    var tr = typeof src === "number" ? null : src;
    stopTests();
    var ins = tr ? insOf(tr) : core.insts[src];
    if (!ins || (ins.k === "vox" && !window.voice)) { return; }
    ctx.resume();
    try {
        if (prevSrc) { prevSrc.stop(); }
    } catch (er) {
        prevSrc = null;
    }
    var vx = tr ? voxOf(tr) : ins.vx, word = w || "la", len = ins.k === "vox" ? 0.45 : 0.6;
    var who = tr ? insKey(tr) + tr.inst + JSON.stringify((tr.x && tr.x.vx) || 0) : src;
    var r = keep("pv" + who + ":" + word + ":" + p, function () {
        if (ins.k === "vox") { return voice.render(ctx, word, p, len, "", vx); }
        return { buf: core.render(ctx, ins, p, len), pre: 0 };
    });
    if (r && r.buf) { prevSrc = core.fire(sfx, r.buf, ctx.currentTime, 0.75, 0, tr && tr.x && tr.x.fx ? bus(tr).in : null); }
};

var schedule = function (a, b, sg) {
    var sp = spt(), t0 = performance.now();
    song.tracks.forEach(function (tr) {
        var list = ord(tr);
        for (var i = seek(list, a); i < list.length && list[i].t < b; i++) {
            var n = list[i];
            if (n._skip) { continue; }
            var r = getBuf(tr, n, n.l * sp, performance.now() - t0 > 120);
            if (r && r.buf) { core.fire(sfx, r.buf, sg.base + (n.t - sg.from) * sp - r.pre, n.v / 127, 0, bus(tr).g); }
        }
    });
};

var tick = function () {
    if (!play.on) { return; }
    var sp = spt();
    var horizon = ctx.currentTime + 0.15;
    for (var guard = 0; guard < 64; guard++) {
        var sg = play.segs[play.segs.length - 1];
        var end = sg.from + (horizon - sg.base) / sp;
        if (ui.loop && hasSec() && play.sched < ui.hi && end >= ui.hi) {
            schedule(play.sched, ui.hi, sg);
            play.segs.push({ from: ui.lo, base: sg.base + (ui.hi - sg.from) * sp });
            if (play.segs.length > 4) { play.segs.shift(); }
            play.sched = ui.lo;
            continue;
        }
        if (end > play.sched) {
            schedule(play.sched, end, sg);
            play.sched = end;
        }
        break;
    }
};

var nowTick = function () {
    if (!play.on) { return ui.head; }
    var now = ctx.currentTime;
    var sg = play.segs[0];
    play.segs.forEach(function (s) {
        if (s.base <= now) { sg = s; }
    });
    return Math.max(0, sg.from + (now - sg.base) / spt());
};

var startPlay = function (from) {
    if (play.on) {
        clearInterval(play.timer);
        sfx.stop();
        play.on = false;
    }
    ctx.resume();
    stopTests();
    mixAll();
    play.start = from;
    $("playBtn").classList.add("on");
    warmUp(from, function () {
        play.on = true;
        play.sched = from;
        play.segs = [{ from: from, base: ctx.currentTime + 0.06 }];
        tick();
        play.timer = setInterval(tick, 25);
        $("playBtn").textContent = "■";
        dirty = true;
    });
};

var stopPlay = function () {
    if (warm.wait) {
        warm.wait = null;
        $("playBtn").textContent = "▶";
        $("playBtn").classList.remove("on");
    }
    if (!play.on) { return; }
    play.on = false;
    clearInterval(play.timer);
    sfx.stop();
    ui.head = play.start;
    var vis = viewTicks();
    if (ui.follow && (ui.head < ui.x || ui.head > ui.x + vis * 0.92)) { ui.x = Math.max(0, ui.head - vis * 0.05); }
    $("playBtn").textContent = "▶";
    $("playBtn").classList.remove("on");
    dirty = true;
};

var toggle = function () {
    if (play.on || warm.wait) {
        stopPlay();
    } else {
        startPlay(ui.head);
    }
};

var setLoop = function (on) {
    if (on && !hasSec()) {
        ui.lo = 0;
        ui.hi = songEnd();
    }
    ui.loop = on;
    $("loopBtn").classList.toggle("on", on);
    dirty = true;
};


// Drawing

var drRuler = function (g, x0, w, h) {
    g.fillStyle = "rgb(31, 34, 41)";
    g.fillRect(x0, 0, w, h);
    if (hasSec()) {
        var la = Math.max(x0, tx(ui.lo, x0));
        g.fillStyle = ui.loop ? "rgba(97, 183, 246, 0.42)" : "rgba(244, 203, 87, 0.3)";
        g.fillRect(la, 0, Math.max(0, tx(ui.hi, x0) - la), h);
    }
    var b = bar(), every = 1;
    while (every * b * ui.zx < 46) { every *= 2; }
    g.font = "11px system-ui, sans-serif";
    g.textBaseline = "middle";
    for (var n = Math.floor(ui.x / b); ; n++) {
        var x = tx(n * b, x0);
        if (x > x0 + w) { break; }
        for (var k = 1; k < 4 && song.res * ui.zx >= 7; k++) {
            g.fillStyle = "rgb(70, 76, 90)";
            if (x + k * song.res * ui.zx > x0) { g.fillRect(Math.round(x + k * song.res * ui.zx), h - 5, 1, 5); }
        }
        if (x < x0) { continue; }
        g.fillStyle = n % every === 0 ? "rgb(98, 106, 122)" : "rgb(70, 76, 90)";
        g.fillRect(Math.round(x), n % every === 0 ? 0 : h - 9, 1, h);
        if (n % every === 0) {
            g.fillStyle = "rgb(181, 187, 200)";
            g.fillText(String(n + 1), x + 4, h / 2);
        }
    }
    g.fillStyle = "rgb(48, 53, 64)";
    g.fillRect(x0, h - 1, w, 1);
};

var drHead = function (g, x0, h) {
    var x = tx(nowTick(), x0);
    if (x >= x0) {
        g.fillStyle = "rgb(252, 214, 105)";
        g.fillRect(Math.round(x), 0, 1.5, h);
    }
};

var drGrid = function (g, x0, w, y0, h) {
    var b = bar();
    var steps = [ui.snap, song.res, b, b * 4, b * 16, b * 64];
    var step = steps.filter(function (s) { return s * ui.zx >= 8; })[0] || b * 64;
    for (var t = Math.floor(ui.x / step) * step; tx(t, x0) <= x0 + w; t += step) {
        if (tx(t, x0) < x0) { continue; }
        g.fillStyle = t % b === 0 ? "rgba(160, 170, 190, 0.22)" : (t % song.res === 0 ? "rgba(160, 170, 190, 0.1)" : "rgba(160, 170, 190, 0.05)");
        g.fillRect(Math.round(tx(t, x0)), y0, 1, h);
    }
    if (hasSec()) {
        var la = Math.max(x0, tx(ui.lo, x0));
        g.fillStyle = ui.loop ? "rgba(97, 183, 246, 0.07)" : "rgba(244, 203, 87, 0.06)";
        g.fillRect(la, y0, Math.max(0, tx(ui.hi, x0) - la), h);
    }
};

var drTop = function () {
    var c = fit(cv.ruler);
    drRuler(c.g, 0, c.w, c.h);
    drHead(c.g, 0, c.h);
};

var drLanes = function () {
    var want = Math.max(song.tracks.length * LANE + LANE, $("arrBody").clientHeight);
    if (cv.lanes.clientHeight !== want) { cv.lanes.style.height = want + "px"; }
    var c = fit(cv.lanes);
    var g = c.g;
    var solo = anySolo();
    if (!c.w) { return; }
    g.fillStyle = "rgb(25, 27, 33)";
    g.fillRect(0, 0, c.w, c.h);
    song.tracks.forEach(function (tr, i) {
        var picked = ui.focus === "tracks" && ui.tsel.indexOf(i) >= 0;
        g.fillStyle = picked ? "rgb(46, 58, 78)" : (i === ui.cur ? "rgb(33, 39, 50)" : (i % 2 ? "rgb(27, 30, 36)" : "rgb(29, 32, 38)"));
        g.fillRect(0, i * LANE, c.w, LANE);
    });
    drGrid(g, 0, c.w, 0, c.h);
    song.tracks.forEach(function (tr, i) {
        var y = i * LANE, list = ord(tr), mn = tr._lo, mx = tr._hi;
        var span = Math.max(12, mx - mn + 1);
        var top = mn + (span - (mx - mn + 1)) / 2 + span - 1;
        var nh = Math.max(2, (LANE - 12) / span);
        g.fillStyle = rgb(insOf(tr).c, tr.mute || (solo && !tr.solo) ? 0.3 : 0.9);
        for (var k = seek(list, ui.x - tr._m); k < list.length; k++) {
            var n = list[k], x = tx(n.t, 0), w = Math.max(2, n.l * ui.zx - 1);
            if (x > c.w) { break; }
            if (x + w > 0) { g.fillRect(x, y + 6 + (top - n.p) / span * (LANE - 12), w, nh); }
        }
        g.fillStyle = "rgb(41, 45, 54)";
        g.fillRect(0, y + LANE - 1, c.w, 1);
    });
    if (ui.range) {
        var ra = Math.min(ui.range.a, ui.range.b), rb = Math.max(ui.range.a, ui.range.b);
        g.fillStyle = "rgba(255, 255, 255, 0.1)";
        g.fillRect(tx(ra, 0), ui.range.row * LANE, (rb - ra) * ui.zx, LANE);
    }
    drHead(g, 0, c.h);
};

var drNote = function (g, n, x, y, w, color, on, label) {
    g.fillStyle = on ? "rgba(255, 255, 255, 0.92)" : color;
    g.beginPath();
    if (g.roundRect) {
        g.roundRect(x, y + 1, w, ui.zy - 2, 3);
    } else {
        g.rect(x, y + 1, w, ui.zy - 2);
    }
    g.fill();
    g.fillStyle = "rgba(0, 0, 0, 0.35)";
    g.fillRect(x + w - 3, y + 3, 2, ui.zy - 6);
    if (label && ui.zy >= 11) {
        g.save();
        g.beginPath();
        g.rect(x, y, w - 4, ui.zy);
        g.clip();
        g.fillStyle = "rgb(30, 22, 34)";
        g.fillText(n.w || "·", x + 4, y + ui.zy / 2 + 0.5);
        g.restore();
    }
};

// Where a join's line runs, as points along it (straight, or an S curve for smooth slides).
var linkPath = function (a, b) {
    var x1 = tx(a.t, HEAD) + Math.max(3, a.l * ui.zx - 1) + 7, y1 = rollY(a.p) + ui.zy / 2;
    var x2 = tx(b.t, HEAD) - 3, y2 = rollY(b.p) + ui.zy / 2, pts = [];
    for (var i = 0; i <= 16; i++) {
        var u = i / 16, k = a.g.c ? u * u * (3 - 2 * u) : u;
        pts.push([x1 + (x2 - x1) * u, y1 + (y2 - y1) * k]);
    }
    return pts;
};

var drLinks = function (g, tr, w, h) {
    var dots = ui.zy >= 10;
    g.strokeStyle = "rgba(240, 242, 248, 0.75)";
    g.lineWidth = 2;
    links(tr).forEach(function (pr) {
        var pts = linkPath(pr[0], pr[1]);
        if (pts[16][0] < HEAD || pts[0][0] > w) { return; }
        g.beginPath();
        pts.forEach(function (pt, i) {
            if (i) {
                g.lineTo(pt[0], pt[1]);
            } else {
                g.moveTo(pt[0], pt[1]);
            }
        });
        g.stroke();
    });
    g.lineWidth = 1;
    if (!dots) { return; }
    var list = ord(tr);
    for (var k = seek(list, ui.x - tr._m); k < list.length && tx(list[k].t, HEAD) <= w; k++) {
        var n = list[k], x = tx(n.t, HEAD), y = rollY(n.p) + ui.zy / 2, nw = Math.max(3, n.l * ui.zx - 1);
        if (y < RUL || y > h) { continue; }
        g.fillStyle = tr._in.has(n) ? "rgb(252, 214, 105)" : "rgba(220, 224, 232, 0.55)";
        g.beginPath();
        g.arc(x - 3, y, 2.5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = n.g ? "rgb(252, 214, 105)" : "rgba(220, 224, 232, 0.55)";
        g.beginPath();
        g.arc(x + nw + 7, y, 3, 0, Math.PI * 2);
        g.fill();
    }
};

var drRoll = function () {
    var c = fit(cv.roll);
    var g = c.g, w = c.w, h = c.h;
    var tr = cur(), ins = tr ? insOf(tr) : null, kit = isKit(tr);
    var pTop = Math.min(127, rollP(RUL));
    var seen = function (n) {
        var x = tx(n.t, HEAD), y = rollY(n.p);
        return x < w && x + n.l * ui.zx > HEAD && y < h && y + ui.zy > RUL;
    };
    ui.py = clampPy(ui.py);
    g.fillStyle = "rgb(25, 27, 33)";
    g.fillRect(0, 0, w, h);
    for (var p = pTop; p >= 0 && rollY(p) <= h; p--) {
        if (kit) {
            g.fillStyle = ins.kit[p] ? "rgb(36, 40, 49)" : "rgb(23, 25, 30)";
        } else {
            g.fillStyle = black(p) ? "rgb(26, 28, 34)" : "rgb(32, 35, 43)";
        }
        g.fillRect(HEAD, rollY(p), w - HEAD, ui.zy);
        if (p % 12 === 0) {
            g.fillStyle = "rgb(48, 53, 64)";
            g.fillRect(HEAD, rollY(p) + ui.zy - 1, w - HEAD, 1);
        }
    }
    drGrid(g, HEAD, w - HEAD, RUL, h - RUL);

    var each = function (o, fn) {
        var list = ord(o);
        for (var k = seek(list, ui.x - o._m); k < list.length && tx(list[k].t, HEAD) <= w; k++) {
            if (seen(list[k])) { fn(list[k]); }
        }
    };
    if (!w) { return; }
    song.tracks.forEach(function (o, i) {
        if (i === ui.cur || isKit(o) || kit) { return; }
        g.fillStyle = rgb(insOf(o).c, 0.16);
        each(o, function (n) { g.fillRect(tx(n.t, HEAD), rollY(n.p) + 1, Math.max(2, n.l * ui.zx - 1), ui.zy - 2); });
    });
    if (tr) {
        var picked = new Set(sel);
        g.font = "600 " + Math.min(12, ui.zy - 2) + "px system-ui, sans-serif";
        g.textBaseline = "middle";
        each(tr, function (n) {
            drNote(g, n, tx(n.t, HEAD), rollY(n.p), Math.max(3, n.l * ui.zx - 1), rgb(ins.c, 0.5 + 0.5 * n.v / 127), picked.has(n), isVox(tr));
        });
        drLinks(g, tr, w, h);
    }
    if (ui.wire) {
        g.strokeStyle = "rgba(252, 214, 105, 0.9)";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(ui.wire.x1, ui.wire.y1);
        g.lineTo(ui.wire.x2, ui.wire.y2);
        g.stroke();
        g.lineWidth = 1;
    }
    if (tr && !tr.notes.length) {
        g.fillStyle = "rgba(200, 206, 220, 0.55)";
        g.font = "14px system-ui, sans-serif";
        g.textAlign = "center";
        g.fillText("Click here to add notes. Drag a note's right edge to make it longer, right click to delete.", HEAD + (w - HEAD) / 2, RUL + 40);
        g.textAlign = "left";
    }
    if (ui.box) {
        var b = ui.box;
        g.fillStyle = "rgba(97, 183, 246, 0.12)";
        g.strokeStyle = "rgb(97, 183, 246)";
        g.fillRect(Math.min(b.x0, b.x1), Math.min(b.y0, b.y1), Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
        g.strokeRect(Math.min(b.x0, b.x1) + 0.5, Math.min(b.y0, b.y1) + 0.5, Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
    }

    g.fillStyle = "rgb(21, 23, 28)";
    g.fillRect(0, RUL, HEAD, h - RUL);
    g.font = "11px system-ui, sans-serif";
    for (var q = pTop; q >= 0 && rollY(q) <= h; q--) {
        var ky = rollY(q), hot = q === ui.hp;
        if (kit) {
            var pc = ins.kit[q];
            g.fillStyle = hot ? "rgb(66, 74, 90)" : (pc ? "rgb(44, 49, 60)" : "rgb(27, 29, 35)");
            g.fillRect(0, ky, HEAD - 1, ui.zy - 1);
            if (pc && ui.zy >= 9) {
                g.fillStyle = rgb(ins.c);
                g.fillText(pc.n, 10, ky + ui.zy / 2);
            }
            continue;
        }
        g.fillStyle = hot ? "rgb(150, 205, 248)" : "rgb(222, 225, 231)";
        g.fillRect(HEAD - Math.min(70, HEAD), ky, Math.min(69, HEAD - 1), ui.zy - 0.5);
        if (black(q)) {
            g.fillStyle = hot ? "rgb(70, 120, 170)" : "rgb(30, 32, 38)";
            g.fillRect(HEAD - Math.min(70, HEAD), ky + 1, Math.min(42, HEAD * 0.6), ui.zy - 2);
        }
        if (q % 12 === 0 && ui.zy >= 9) {
            g.fillStyle = HEAD > 110 ? "rgb(141, 148, 163)" : "rgb(30, 32, 38)";
            g.fillText(pname(q), HEAD > 110 ? HEAD - 104 : HEAD - 24, ky + ui.zy / 2);
        }
    }
    drRuler(g, HEAD, w - HEAD, RUL);
    g.fillStyle = "rgb(31, 34, 41)";
    g.fillRect(0, 0, HEAD, RUL);
    g.fillStyle = tr ? rgb(ins.c) : "rgb(141, 148, 163)";
    g.font = "600 12px system-ui, sans-serif";
    if (HEAD > 110) { g.fillText(tr ? tr.name : "No track", 8, RUL / 2); }
    g.fillStyle = "rgb(48, 53, 64)";
    g.fillRect(0, RUL - 1, HEAD, 1);
    g.fillRect(HEAD - 1, 0, 1, h);
    drHead(g, HEAD, h);
};

var drClock = function () {

};

var frame = function () {

};

var focusTrack = function () {

var setCur = function (i) {

var setInst = function (tr, inst) {

var delTrack = function (i) {

// Note editing
// Left adds, moves and stretches, a second click edits, right deletes, the middle button moves the view, the wheel zooms.
// On touch screens one finger edits, two fingers move and pinch to zoom, and the trash button turns taps into deletes.

var rollPos = function (e) {
    var r = cv.roll.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
};

var hitNote = function (tr, x, y) {
    if (!tr || y < RUL || x < HEAD) { return null; }
    var p = rollP(y), t = rollT(x), list = ord(tr);
    for (var i = seek(list, t + 1) - 1; i >= 0 && list[i].t >= t - tr._m - 1; i--) {
        var n = list[i];
        if (n.p === p && x >= tx(n.t, HEAD) && x <= tx(n.t, HEAD) + Math.max(3, n.l * ui.zx)) { return n; }
    }
    return null;
};

// The note under a point in the track view, using the same layout the lanes are drawn with.
var hitLane = function (row, x, y) {
    var tr = song.tracks[row];
    if (!tr) { return null; }
    var list = ord(tr), mn = tr._lo, mx = tr._hi, span = Math.max(12, mx - mn + 1);
    var top = mn + (span - (mx - mn + 1)) / 2 + span - 1, nh = Math.max(2, (LANE - 12) / span);
    for (var k = seek(list, ui.x + x / ui.zx + 1) - 1; k >= 0 && list[k].t >= ui.x + x / ui.zx - tr._m - 1; k--) {
        var n = list[k], nx = tx(n.t, 0), ny = row * LANE + 6 + (top - n.p) / span * (LANE - 12);
        if (x >= nx - 2 && x <= nx + Math.max(4, n.l * ui.zx) && y >= ny - 3 && y <= ny + nh + 3) { return n; }
    }
    return null;
};

// The note whose output dot (just past its right end) is under the pointer.
var outAt = function (tr, m) {
    if (!tr || ui.zy < 10) { return null; }
    var list = ord(tr), best = null;
    for (var k = seek(list, ui.x - tr._m); k < list.length && tx(list[k].t, HEAD) <= m.x + 10; k++) {
        var n = list[k], ox = tx(n.t, HEAD) + Math.max(3, n.l * ui.zx - 1) + 7, oy = rollY(n.p) + ui.zy / 2;
        if (m.x > ox - 4 && Math.hypot(m.x - ox, m.y - oy) <= 6) { best = n; }
    }
    return best;
};

// The join whose line passes under the pointer, as its starting note.
var linkAt = function (tr, m) {
    if (!tr) { return null; }
    var hit = null;
    links(tr).forEach(function (pr) {
        var pts = linkPath(pr[0], pr[1]);
        for (var i = 1; i < pts.length && !hit; i++) {
            var ax = pts[i - 1][0], ay = pts[i - 1][1], bx = pts[i][0], by = pts[i][1];
            var len = Math.max(1, (bx - ax) * (bx - ax) + (by - ay) * (by - ay));
            var u = clamp(((m.x - ax) * (bx - ax) + (m.y - ay) * (by - ay)) / len, 0, 1);
            if (Math.hypot(m.x - (ax + (bx - ax) * u), m.y - (ay + (by - ay) * u)) <= 5) { hit = pr[0]; }
        }
    });
    return hit;
};

// Join one note's output to a later note's input. A note only takes one slide in.
var join = function (a, b) {
    var tr = cur();
    if (!a || !b || a === b || b.t <= a.t) { return false; }
    links(tr).forEach(function (pr) {
        if (pr[1] === b && pr[0] !== a) { delete pr[0].g; }
    });
    a.g = { dt: b.t - a.t, dp: b.p - a.p, ms: a.g ? a.g.ms : 120, c: a.g ? a.g.c : 0 };
    bump();
    return true;
};

// A small box for a join: how long the slide takes and whether it is straight or smooth.
var editSlide = function (n) {
    var g = n.g;
    modal({
        title: "Slide",
        html: '<p class="note">The second note starts at the first note\'s pitch and slides to its own.</p>' + knob("Slide time (ms)", 20, 2000, g.ms, 10) +
            '<label class="knob"><span>Shape</span><select id="slShape"><option value="0">Straight (linear)</option><option value="1">Smooth (cubic)</option></select><span></span></label>',
        btns: [
            { t: "Done", hi: true, fn: closeModal },
            {
                t: "Remove slide",
                fn: function () {
                    delete n.g;
                    commit();
                    closeModal();
                }
            }
        ]
    });
    var range = $("mText").querySelector("input[type=range]");
    $("slShape").value = g.c ? 1 : 0;
    range.addEventListener("input", function () {
        g.ms = Number(range.value);
        range.nextElementSibling.textContent = range.value;
    });
    range.addEventListener("change", commit);
    $("slShape").addEventListener("change", function () {
        g.c = Number($("slShape").value);
        commit();
    });
};

var nearEdge = function (n, x) {
    var w = Math.max(3, n.l * ui.zx);
    return x > tx(n.t, HEAD) + w - Math.min(7, w / 3);
};

var removeNotes = function (tr, list) {
    var gone = new Set(list);
    links(tr).forEach(function (pr) {
        if (gone.has(pr[1])) { delete pr[0].g; }
    });
    tr.notes = tr.notes.filter(function (n) { return !gone.has(n); });
    sel = sel.filter(function (n) { return !gone.has(n); });
    bump();
};

var startPan = function (e, roll) {
    e.preventDefault();
    drag = { k: "pan", roll: roll, cx: e.clientX, cy: e.clientY, ux: ui.x, upy: ui.py, st: $("arrBody").scrollTop };
};

[cv.roll, cv.lanes, cv.ruler].forEach(function (c) {
    c.addEventListener("contextmenu", function (e) { e.preventDefault(); });
});

// Fingers on the board; a second finger turns whatever the first was doing into move and zoom.
var fingers = new Map();

var gesture = function (e, roll) {
    if (e.pointerType !== "touch") { return false; }
    fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (fingers.size !== 2) { return false; }
    if (drag && drag.fresh && cur()) { removeNotes(cur(), [drag.ref]); }
    var f = Array.from(fingers.values());
    drag = {
        k: "pinch", roll: roll, ux: ui.x, upy: ui.py, zx: ui.zx, st: $("arrBody").scrollTop,
        mx: (f[0].x + f[1].x) / 2, my: (f[0].y + f[1].y) / 2, d: Math.max(20, Math.hypot(f[0].x - f[1].x, f[0].y - f[1].y))
    };
    return true;
};

var rulerDown = function (e, xr) {
    drag = { k: "ruler", x0: e.clientX - xr, cx: e.clientX, a: snapT(ui.x + xr / ui.zx), moved: false };
};

cv.ruler.addEventListener("pointerdown", function (e) {
    if (gesture(e, false)) { return; }
    if (e.button === 1) { startPan(e, false); }
    if (e.button === 0) { rulerDown(e, e.clientX - cv.ruler.getBoundingClientRect().left); }
});

var lastTap = { t: 0, n: null };

cv.roll.addEventListener("pointerdown", function (e) {
    var m = rollPos(e);
    var tr = cur();
    if (gesture(e, true)) { return; }
    shutLyric(true);
    ui.focus = "notes";
    pickMarks();
    if (e.button === 1) { return startPan(e, true); }
    if (m.y < RUL) {
        if (m.x >= HEAD && e.button === 0) { rulerDown(e, m.x - HEAD); }
        return;
    }
    if (!tr) { return; }
    if (m.x < HEAD) {
        drag = { k: "key", p: rollP(m.y) };
        preview(tr, drag.p, "la");
        return;
    }
    var tk = rollT(m.x), p = clamp(rollP(m.y), 0, 127);
    var hit = hitNote(tr, m.x, m.y);
    var now = performance.now();
    var out = !hit && outAt(tr, m), wire = !hit && !out && linkAt(tr, m);
    dirty = true;
    if (wire && (e.button === 2 || ui.trash)) {
        delete wire.g;
        commit();
        return;
    }
    if (wire && e.button === 0) {
        editSlide(wire);
        return;
    }
    if (out && e.button === 0 && !ui.trash) {
        var oy = rollY(out.p) + ui.zy / 2;
        drag = { k: "link", from: out };
        ui.wire = { x1: tx(out.t, HEAD) + Math.max(3, out.l * ui.zx - 1) + 7, y1: oy, x2: m.x, y2: m.y };
        return;
    }
    if (e.button === 2 || (ui.trash && e.button === 0)) {
        drag = { k: "erase", hit: !!hit };
        if (hit) { removeNotes(tr, [hit]); }
        return;
    }
    if (e.button !== 0) { return; }
    if (hit && lastTap.n === hit && now - lastTap.t < 400) {
        lastTap.n = null;
        editNote(hit);
        return;
    }
    lastTap = { t: now, n: hit };
    if (!hit && e.shiftKey) {
        sel = [];
        ui.box = { x0: m.x, y0: m.y, x1: m.x, y1: m.y };
        drag = { k: "box" };
        return;
    }
    if (!hit) {
        var n = { t: Math.max(0, Math.floor(tk / ui.snap) * ui.snap), l: isKit(tr) ? Math.max(ui.snap, 3) : ui.len, p: p, v: ui.vel, w: "" };
        tr.notes.push(n);
        bump();
        sel = [n];
        lastTap = { t: now, n: n };
        drag = { k: "size", fresh: true, t0: tk, cx: m.x, orig: [{ n: n, t: n.t, l: n.l, p: n.p }], ref: n, moved: true };
        preview(tr, p, "la");
        return;
    }
    if (e.shiftKey) {
        if (sel.indexOf(hit) >= 0) {
            sel.splice(sel.indexOf(hit), 1);
        } else {
            sel.push(hit);
        }
        return;
    }
    if (sel.indexOf(hit) < 0) { sel = [hit]; }
    var made = e.ctrlKey || e.metaKey;
    if (made) {
        var copies = sel.map(copyNote);
        tr.notes = tr.notes.concat(copies);
        bump();
        hit = copies[sel.indexOf(hit)];
        sel = copies;
    }
    ui.vel = $("vel").value = hit.v;
    var edge = !made && nearEdge(hit, m.x);
    var orig = sel.map(function (o) { return { n: o, t: o.t, l: o.l, p: o.p }; });
    drag = {

var moves = {
    ruler: function (e) {
        if (Math.abs(e.clientX - drag.cx) < 4 && !drag.moved) { return; }
        var b = snapT(ui.x + (e.clientX - drag.x0) / ui.zx);
        drag.moved = true;
        sel = [];
        ui.lo = Math.min(drag.a, b);

    pan: function (e) {
        ui.x = Math.max(0, drag.ux - (e.clientX - drag.cx) / ui.zx);

    },
    pinch: function () {
        var f = Array.from(fingers.values());

        var mx = (f[0].x + f[1].x) / 2, my = (f[0].y + f[1].y) / 2, d = Math.max(20, Math.hypot(f[0].x - f[1].x, f[0].y - f[1].y));

    split: function (e) { setSplit(drag.h0 + e.clientY - drag.y0); },
    key: function (e, m) {

    },
    move: function (e, m) {
        var dt = Math.max(Math.round((rollT(m.x) - drag.t0) / ui.snap) * ui.snap, -drag.minT);
        var dp = clamp(clamp(rollP(m.y), 0, 127) - drag.p0, -drag.minP, 127 - drag.maxP);

    size: function (e, m) {

    box: function (e, m) {

window.addEventListener("pointermove", function (e) {

var lift = function (e) {
    fingers.delete(e.pointerId);
    if (!drag || (drag.k === "pinch" && fingers.size)) { return; }
    var d = drag;
    drag = null;
    ui.box = null;
    if (d.k === "move" && d.pairs) { relink(d.pairs, true); }
    if ((d.k === "move" || d.k === "size") && d.moved) { commit(); }
    if (d.k === "link") {
        var m = rollPos(e);
        if (join(d.from, hitNote(cur(), m.x + 4, m.y) || hitNote(cur(), m.x, m.y))) { commit(); }
        ui.wire = null;
    }
    if (d.k === "order") { moveTrack(d.from, d.to); }
    if (d.k === "size" && d.fresh && isVox(cur())) { openLyric(d.ref); }
    if (d.k === "erase" && d.hit) { commit(); }

window.addEventListener("pointercancel", lift);

// The wheel zooms. Alt or Ctrl with the wheel over the notes changes their height, a sideways swipe scrolls.
var wheel = function (e, x0, roll) {
    var r = e.currentTarget.getBoundingClientRect();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        ui.x = Math.max(0, ui.x + e.deltaX / ui.zx);
    } else if (roll && (e.altKey || (e.ctrlKey && !e.deltaMode && Math.abs(e.deltaY) > 40))) {

        ui.zy = clamp(ui.zy + (e.deltaY < 0 ? 1 : -1), 6, 30);
        ui.py = clampPy(pAt * ui.zy - (my - RUL));
    } else {
        zoomAt(e.clientX - r.left - x0, Math.pow(1.0015, -e.deltaY * (e.deltaMode ? 30 : 1)));

    dirty = true;

cv.roll.addEventListener("wheel", function (e) { wheel(e, HEAD, true); }, { passive: false });
cv.lanes.addEventListener("wheel", function (e) { wheel(e, 0, false); }, { passive: false });

// Lyrics

var lyr = { el: $("lyric"), n: null };

var neighbor = function (n, dir) {
    var list = ord(cur());
    return list[list.indexOf(n) + dir] || null;
};

// Double click on a note: lyrics for voices, loudness (1 to 127) for everything else.
var editNote = function (n) {
    openLyric(n, isVox(cur()) ? "w" : "v");
};

var openLyric = function (n, mode) {
    var el = lyr.el;
    var vis = viewTicks();
    if (n.t < ui.x || n.t > ui.x + vis * 0.85) { ui.x = Math.max(0, n.t - vis * 0.2); }
    if (rollY(n.p) < RUL || rollY(n.p) > cv.roll.clientHeight - ui.zy) { ui.py = clampPy((127 - n.p) * ui.zy - (cv.roll.clientHeight - RUL) / 2); }
    lyr.n = n;
    lyr.mode = mode || "w";
    sel = [n];
    el.style.left = tx(n.t, HEAD) + "px";
    el.style.top = (rollY(n.p) + ui.zy / 2 - 11) + "px";
    el.style.width = lyr.mode === "v" ? "64px" : Math.max(84, n.l * ui.zx) + "px";
    el.placeholder = lyr.mode === "v" ? "1-127" : "";
    el.value = lyr.mode === "v" ? n.v : (n.w || "");
    el.classList.add("show");
    el.focus();
    el.select();
    dirty = true;
};

var splitWords = function (text) {
    var out = [];
    String(text).split(/\s+/).forEach(function (w) {
        var bits = w.split("-");
        bits.forEach(function (b, i) {
            if (b) { out.push(i < bits.length - 1 ? b + "-" : b); }
        });
    });
    return out;
};

var shutLyric = function (save) {
    if (!lyr.n) { return; }
    var n = lyr.n;
    lyr.n = null;
    lyr.el.classList.remove("show");
    dirty = true;
    if (!save) { return; }
    if (lyr.mode === "v") {
        n.v = clamp(Math.round(Number(lyr.el.value)) || n.v, 1, 127);
        commit();
        return;
    }
    liveScrub(lyr.el, true);
    var words = splitWords(core.clean(lyr.el.value.trim()));
    var list = ord(cur());
    var at = list.indexOf(n);
    n.w = words[0] || "";
    for (var i = 1; i < words.length && at + i < list.length && !list[at + i].w; i++) { list[at + i].w = words[i]; }
    commit();
};

lyr.el.addEventListener("input", function () {
    if (lyr.mode !== "v") { liveScrub(lyr.el, false); }
});
lyr.el.addEventListener("blur", function () { shutLyric(true); });
lyr.el.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Enter" || e.key === "Escape") { shutLyric(e.key === "Enter"); }
    if (e.key !== "Tab") { return; }
    e.preventDefault();
    var n = lyr.n, mode = lyr.mode;
    shutLyric(true);
    var nx = n && neighbor(n, e.shiftKey ? -1 : 1);

// Copy, paste and sections

// A copy of a track without the sorted cache.
var trackCopy = function (tr) {
    return JSON.parse(JSON.stringify(tr, function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
};

var copy = function () {
    if (ui.focus === "tracks" && ui.tsel.length) {
        clip = { kind: "tracks", tracks: ui.tsel.slice().sort(function (a, b) { return a - b; }).map(function (i) { return trackCopy(song.tracks[i]); }) };
    } else if (sel.length) {
        var t0 = minOf(sel, "t");
        clip = { kind: "notes", notes: sel.map(function (n) { var c = copyNote(n); c.t -= t0; return c; }) };
    } else if (hasSec()) {
        clip = { kind: "sec", len: ui.hi - ui.lo, rows: song.tracks.map(function (tr) {
            return tr.notes.filter(inSec).map(function (n) { var c = copyNote(n); c.t -= ui.lo; return c; });
        }) };
    }
};

var paste = function (t) {
    if (!clip) { return; }
    var put = function (tr, list) {
        var made = list.map(function (c) { var n = copyNote(c); n.t += t; return n; });
        tr.notes = tr.notes.concat(made);
        return made;
    };
    if (clip.kind === "tracks") {
        var at = ui.tsel.length ? Math.max.apply(null, ui.tsel) + 1 : song.tracks.length;
        var made = clip.tracks.map(trackCopy);
        song.tracks.splice.apply(song.tracks, [at, 0].concat(made));
        ui.focus = "tracks";
        ui.tsel = made.map(function (m, i) { return at + i; });
        ui.cur = -1;
        renderHeads();
        setCur(at);
        pickMarks();
        mixAll();
    }
    if (clip.kind === "notes" && cur()) { sel = put(cur(), clip.notes); }
    if (clip.kind === "sec") {
        clip.rows.forEach(function (row, i) {
            if (song.tracks[i]) { put(song.tracks[i], row); }
        });
        sel = [];
        ui.lo = t;
        ui.hi = t + clip.len;
    }
    commit();
};

var wipe = function () {
    if (ui.focus === "tracks" && ui.tsel.length) {
        ui.tsel.slice().sort(function (a, b) { return b - a; }).forEach(function (i) {
            var b = buses.get(song.tracks[i]);
            if (b) { b.g.disconnect(); }
            song.tracks.splice(i, 1);
        });
        ui.tsel = [];
        ui.cur = clamp(ui.cur, 0, Math.max(0, song.tracks.length - 1));
        renderHeads();
        mixAll();
    } else if (sel.length && cur()) {
        removeNotes(cur(), sel.slice());
    } else if (hasSec()) {
        song.tracks.forEach(function (tr) { tr.notes = tr.notes.filter(function (n) { return !inSec(n); }); });
    }
    commit();
};

var dup = function () {
    if (sel.length) {
        var span = Math.ceil((maxOf(sel.map(function (n) { return { e: n.t + n.l }; }), "e") - minOf(sel, "t")) / song.res) * song.res;
        var t0 = minOf(sel, "t");
        copy();
        paste(t0 + span);
    } else if (hasSec()) {
        copy();
        paste(ui.hi);
    }
};

var nudge = function (dt, dp) {
    if (!sel.length) { return; }
    dt = Math.max(dt, -minOf(sel, "t"));
    dp = clamp(dp, -minOf(sel, "p"), 127 - maxOf(sel, "p"));
    var pairs = links(cur());
    sel.forEach(function (n) {
        n.t += dt;
        n.p += dp;
    });
    relink(pairs, true);
    if (sel.length === 1 && dp) { preview(cur(), sel[0].p, sel[0].w); }
    commit();
};

$("copyBtn").addEventListener("click", copy);
$("pasteBtn").addEventListener("click", function () { paste(snapT(ui.head)); });
$("dupBtn").addEventListener("click", dup);
$("delBtn").addEventListener("click", wipe);


// Keyboard

window.addEventListener("keydown", function (e) {
    var a = document.activeElement;
    var tag = a ? a.tagName : "";
    if (stage) { return; }
    if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && a.type !== "range")) {
        if (e.key === "Escape" || (e.key === "Enter" && tag === "INPUT")) { a.blur(); }
        return;
    }

        return;
    }
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    var ctrl = e.ctrlKey || e.metaKey;
    var keys = {
        " ": toggle,
        Home: function () {
            if (play.on) { startPlay(0); }
            ui.head = ui.x = 0;
        },
        Delete: wipe,
        Backspace: wipe,
        Escape: function () {
            sel = [];
            ui.tsel = [];

            ui.lo = ui.hi = 0;

        ArrowUp: function () { nudge(0, e.shiftKey ? 12 : 1); },

        ArrowRight: function () { nudge(ui.snap, 0); },

    var ctrlKeys = {
        z: e.shiftKey ? redo : undo,
        y: redo,
        c: copy,
        x: function () {
            copy();
            wipe();
        },
        v: function () { paste(snapT(ui.head)); },
        d: dup,
        a: function () {
            if (ui.focus === "tracks") {
                ui.tsel = song.tracks.map(function (t, i) { return i; });
                pickMarks();
            } else {
                sel = cur() ? cur().notes.slice() : [];
            }
        }
    };
    var fn = ctrl ? ctrlKeys[k] : keys[k];
    if (!fn) { return; }
    e.preventDefault();
    fn();
    dirty = true;
});

document.addEventListener("click", function (e) {

});

// Picks a visual that suits a song: Piano Roll for melody songs without drums or led by piano,
// Bars for fast dance beats, Stars for big busy songs, and Orbit for the rest.
var autoVis = function (sg) {
    var count = 0, kit = 0, keys = 0;
    sg.tracks.forEach(function (tr) {
        var ins = core.insOf(tr) || {}, name = ins.n || "";
        count += tr.notes.length;
        if (ins.k === "kit") { kit += tr.notes.length; }
        if (/Piano|Music Box|Harp|Marimba|Bell|Harpsichord/.test(name)) { keys += tr.notes.length; }
    });
    if (!kit || keys > count * 0.4) { return 1; }
    if (sg.bpm >= 116) { return 2; }
    if (sg.tracks.length >= 8) { return 4; }
    return 3;
};

// Text, PJS and player exports share this dialog.
// "Visual for this song" changes the song itself, the other choices only change what gets exported.
var expPick = null;
var exportBox = function (kind) {
    commit();

    var mode = "own", same = 1;
    // The ticked songs, and the visual for each one when it should not keep its own.
    var looks = null;
    var chosen = function () {
        var out = [];
        looks = mode === "own" ? null : [];
        book.list.forEach(function (t, i) {
            if (!expPick[i]) { return; }
            out.push(t);
            if (!looks) { return; }
            var inf = pjs.info(t);
            if (inf.auto === undefined) { inf.auto = autoVis(inf.s); }
            looks.push(mode === "auto" ? inf.auto : same);
        });
        return out;
    };
    // Song text has to carry its visual inside it, so the song list re-encodes changed songs (remembered per song).
    var withVis = function (t, v) {
        var inf = pjs.info(t);
        inf.as = inf.as || {};
        if (inf.as[v] === undefined) {
            var sg = core.decode(t);
            sg.vis = v;
            inf.as[v] = core.encode(sg);

// Saved songs live in this browser under one key: { slots: [{ name, text, at }] }.
var stored = function () {
    var raw = null;
    try {
        raw = localStorage.getItem(SAVE);
    } catch (er) {
        return [];
    }
    if (!raw) { return []; }
    var list;
    try {
        if (raw.charAt(0) !== "{") {
            list = [{ name: titleOf(raw, 0), text: raw, at: 0 }];
        } else {
            var data = JSON.parse(raw);
            list = data.slots || (data.songs || []).map(function (t, i) { return { name: titleOf(t, i), text: t, at: 0 }; });
        }
    } catch (er) {
        return [];
    }
    // Anything that is not a song we can read (damaged data, or another program's) is left out.
    return (Array.isArray(list) ? list : []).filter(function (sl) {
        if (!sl || typeof sl.text !== "string") { return false; }
        try {
            core.decode(sl.text);
        } catch (er) {
            return false;
        }
        sl.name = typeof sl.name === "string" ? sl.name : "Untitled";
        return true;
    });
};

var storeSlots = function (slots) {
    localStorage.setItem(SAVE, JSON.stringify({ slots: slots }));
};

var saveBox = function (msg) {
    var slots = stored();
    var rows = slots.map(function (sl, i) {
        var when = sl.at ? new Date(sl.at).toLocaleString() : "";
        return '<div class="slot"><b>' + sl.name.replace(/</g, "&lt;") + "</b><span>" + when + '</span><button data-load="' + i + '">Load</button><button data-del="' + i + '">Delete</button></div>';
    }).join("");
    modal({
        title: "Saved songs",
        html: '<span class="warn">Before you save:</span> songs are kept in this browser\'s local storage. ' +
            "They only stay on this device and browser, clearing your browsing data deletes them, " +
            "and other pages on the same site (like other Khan Academy programs) can read or overwrite them. " +
            "Nothing is stored unless you press a save button here. For copies you can't lose, use Export Text." +
            (msg ? "<br><br><b>" + msg + "</b>" : "") +
            '<div id="slots">' + (rows || '<p class="note">No saved songs yet.</p>') + "</div>",
        btns: [
            { t: "Save this song", hi: true, fn: function () { saveSongs([book.list[book.at]]); } },
            { t: "Save all " + book.list.length + " songs", fn: function () { saveSongs(book.list); } },
            { t: "Close", fn: closeModal }
        ]
    });
    $("slots").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) { return; }
        var all = stored();
        if (b.dataset.load !== undefined) {
            addSongs([all[Number(b.dataset.load)].text]);
            closeModal();
            return;
        }
        var gone = all.splice(Number(b.dataset.del), 1)[0];
        try {
            storeSlots(all);
        } catch (er) {
            saveBox("This browser blocked the change.");
            return;
        }
        saveBox("Deleted " + gone.name.replace(/</g, "&lt;") + ".");
    });
};

// A song saved under a name that is already there replaces that copy.
var saveSongs = function (texts) {
    try {
        var slots = stored();
        texts.forEach(function (t, i) {
            var name = titleOf(t, i), at = slots.map(function (sl) { return sl.name; }).indexOf(name);
            var item = { name: name, text: t, at: Date.now() };
            if (at >= 0) {
                slots[at] = item;
            } else {
                slots.push(item);
            }
        });
        storeSlots(slots);
        saveBox("Saved " + texts.length + (texts.length === 1 ? " song." : " songs."));
    } catch (er) {
        $("mText").innerHTML = '<span class="warn">This browser blocked saving. Use Export Text instead.</span>';
    }
};

var fxKnobs = [
    ["e", "Echo", 0, 100], ["et", "Echo time (ms)", 60, 900], ["rm", "Room", 0, 100], ["ro", "Robot", 0, 100],
    ["mu", "Muffle", 0, 100], ["ra", "Radio", 0, 100], ["dr", "Drive", 0, 100], ["cr", "Crush", 0, 100]
];

// Voice sliders run 0 to 100 (pitch in semitones) and turn into the singer's settings.
var voxKnobs = [
    ["fs", "Depth", 0, 100, function (v) { return 1.3 - v * 0.005; }, function (x) { return (1.3 - x) / 0.005; }],
    ["tb", "Treble", 0, 100, function (v) { return v; }, function (x) { return x; }],
    ["br", "Breath", 0, 100, function (v) { return v * 0.006; }, function (x) { return x / 0.006; }],
    ["vd", "Vibrato", 0, 100, function (v) { return v * 0.01; }, function (x) { return x / 0.01; }],
    ["vr", "Vibrato rate", 0, 100, function (v) { return 3 + v * 0.06; }, function (x) { return (x - 3) / 0.06; }]
];

var layerKeys = [
    ["w", "Wave", ["sin", "tri", "saw", "sqr", "pls", "noi", "ks"]], ["g", "Gain"], ["m", "Pitch multiple"], ["f", "Fixed pitch (Hz)"],
    ["dt", "Detune (cents)"], ["a", "Attack (s)"], ["d", "Decay (s)"], ["s", "Sustain level"], ["r", "Release (s)"], ["pw", "Pulse width"],
    ["pe", "Pitch drop (semitones, time)", "list"], ["vb", "Vibrato (rate, cents, delay)", "list"], ["ft", "Filter", ["", "lp", "hp", "bp"]],
    ["fc", "Cutoff start"], ["fe", "Cutoff end"], ["fd", "Cutoff time"], ["fk", "Cutoff follows note", "chk"], ["fq", "Resonance"],
    ["fl", "Cutoff wobble (rate, octaves)", "list"], ["qz", "Crush steps"], ["nr", "Noise rate"], ["bu", "Clap bursts"],
    ["br", "Pluck brightness"], ["dm", "Pluck damping"]
];

var xOf = function (tr) {
    tr.x = tr.x || {};
    return tr.x;
};

// Drops empty parts so unedited tracks stay as small as before.
var tidyX = function (tr) {
    if (!tr.x) { return; }
    ["fx", "vx"].forEach(function (k) {
        if (tr.x[k] && !Object.keys(tr.x[k]).length) { delete tr.x[k]; }
    });

};

var edChanged = function () {

var knob = function (label, min, max, val, step) {

            return knob(k[1], k[2], k[3], v).replace("<input", '<input data-fx="' + k[0] + '"');
        }).join("");

var edVoice = function () {
    if (!isVox(ed.tr)) {
        $("eBody").innerHTML = '<p class="note">Voice settings are for Vox tracks. Switch this track to a Vox instrument to shape a singer.</p>';

// The instrument's raw data: layers for synths, pieces for kits, the singer's numbers for voices.
var edAdv = function () {
    var tr = ed.tr, ins = insOf(tr), html = '<div class="graphs"><canvas id="gEnv" width="520" height="110"></canvas><canvas id="gWave" width="260" height="110"></canvas></div>';
    if (ins.k === "vox") {
        var vx = voxOf(tr);
        html += '<p class="note">The singer\'s raw numbers. fs formant size, op / cl pulse shape, tl tone, br breath, vr / vd vibrato, tb treble.</p><div class="fields">' +
            ["fs", "op", "cl", "tl", "br", "vr", "vd", "tb"].map(function (k) {
                return '<label>' + k + '<input data-raw="' + k + '" value="' + (vx[k] !== undefined ? vx[k] : "") + '"></label>';
            }).join("") + "</div>";
        $("eBody").innerHTML = html;

    }
    var keys = ins.k === "kit" ? Object.keys(ins.kit) : null;
    if (keys && keys.indexOf(String(ed.piece)) < 0) { ed.piece = Number(keys[0]); }
    var pc = keys ? ins.kit[ed.piece] : ins;
    html += '<p class="note">' + (tr.x && tr.x.ins ? "This track has its own copy of the instrument." : "Changing anything gives this track its own copy, the preset stays the same.") +
        " Each layer is one sound stacked on the others.</p>";
    if (keys) {
        html += '<label class="knob"><span>Drum piece</span><select id="ePiece">' + keys.map(function (k) {
            return '<option value="' + k + '"' + (Number(k) === ed.piece ? " selected" : "") + ">" + ins.kit[k].n + "</option>";
        }).join("") + '</select><span></span></label><label class="knob"><span>Length (s)</span><input data-len="1" value="' + pc.len + '"><span></span></label>';
    }
    html += pc.l.map(function (L, i) {
        return '<div class="layer"><div class="lhead">Layer ' + (i + 1) + ' <button data-drop="' + i + '">Remove</button></div><div class="fields">' +
            layerKeys.map(function (k) {
                var v = L[k[0]], field;
                if (Array.isArray(k[2])) {
                    field = '<select data-l="' + i + '" data-k="' + k[0] + '">' + k[2].map(function (o) { return '<option value="' + o + '"' + ((v || "") === o ? " selected" : "") + ">" + (o || "none") + "</option>"; }).join("") + "</select>";
                } else if (k[2] === "chk") {
                    field = '<input type="checkbox" data-l="' + i + '" data-k="' + k[0] + '"' + (v ? " checked" : "") + ">";
                } else {
                    field = '<input data-l="' + i + '" data-k="' + k[0] + '" data-t="' + (k[2] || "num") + '" value="' + (v === undefined ? "" : (Array.isArray(v) ? v.join(", ") : v)) + '">';
                }
                return "<label>" + k[1] + field + "</label>";
            }).join("") + "</div></div>";
    }).join("") + '<button id="eAddLayer">+ Layer</button>';
