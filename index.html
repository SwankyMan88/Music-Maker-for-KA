};

// The track's own instrument to change, copied from the preset the first time.
var ownIns = function () {
    var x = xOf(ed.tr);
    if (!x.ins) { x.ins = JSON.parse(JSON.stringify(core.insts[ed.tr.inst])); }
    var ins = x.ins;
    return ins.k === "kit" ? ins.kit[ed.piece] : ins;
};

var edGraph = function () {
    var env = $("gEnv"), wave = $("gWave");
    if (!env) { return; }
    var tr = ed.tr, ins = insOf(tr), p = Number($("ePitch").value), r;
    if (ins.k === "vox") {
        if (!window.voice) { return; }
        var vx = voxOf(tr);
        r = voice.render(ctx, "ah", p, 0.8, "", vx);
    } else {
        r = { buf: core.render(ctx, ins, ins.k === "kit" ? ed.piece : p, 0.8) };
    }
    [env, wave].forEach(function (c) {
        var g = c.getContext("2d");
        g.fillStyle = "rgb(20, 22, 27)";
        g.fillRect(0, 0, c.width, c.height);
        g.fillStyle = "rgb(70, 76, 90)";
        g.font = "11px system-ui, sans-serif";
        g.fillText(c === env ? "Loudness over the note" : "Wave shape", 8, 14);
    });
    if (!r || !r.buf) { return; }
    var d = r.buf.getChannelData(0), g1 = env.getContext("2d"), g2 = wave.getContext("2d"), peak = 0.0001;
    for (var i = 0; i < d.length; i++) { peak = Math.max(peak, Math.abs(d[i])); }
    g1.fillStyle = rgb(ins.c, 0.85);
    var per = Math.ceil(d.length / env.width);
    for (var x = 0; x < env.width; x++) {
        var m = 0;
        for (var j = x * per; j < Math.min(d.length, (x + 1) * per); j++) { m = Math.max(m, Math.abs(d[j])); }
        var h = m / peak * (env.height - 24);
        g1.fillRect(x, env.height - 4 - h, 1, h);
    }
    var from = Math.floor(Math.min(0.12, d.length / ctx.sampleRate / 3) * ctx.sampleRate), span = Math.floor(0.03 * ctx.sampleRate);
    g2.strokeStyle = rgb(ins.c);
    g2.beginPath();
    for (var k = 0; k < wave.width; k++) {
        var v = d[Math.min(d.length - 1, from + Math.floor(k / wave.width * span))] / peak;
        var y = wave.height / 2 + 6 - v * (wave.height / 2 - 14);
        if (k) {
            g2.lineTo(k, y);
        } else {
            g2.moveTo(k, y);
        }
    }
    g2.stroke();
};

(function () {

        var o = document.createElement("option");
        o.value = m;
        o.textContent = pname(m);
        $("ePitch").appendChild(o);
    }
})();

document.querySelector(".etabs").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) { edShow(b.dataset.tab); }
});

$("eClose").addEventListener("click", function () {
    $("edit").classList.add("hide");
    renderHeads();
});

$("edit").addEventListener("mousedown", function (e) {
    if (e.target.id === "edit") { $("eClose").click(); }
});

// Sings the test words one after another, or plays one test note.
// Sings the test words (the last one held so vibrato and breath come through), or plays one test note.
// Pressing Test while a test plays stops it.
$("eTest").addEventListener("click", function () {
    var tr = ed.tr, p = Number($("ePitch").value);
    var busy = tests.length > 0;
    stopTests();
    if (busy) { return; }
    if (play.on) { stopPlay(); }
    if (isKit(tr) || !isVox(tr) || !window.voice) {
        preview(tr, isKit(tr) ? ed.piece : p);
        addTest(prevSrc);
        return;
    }
    ctx.resume();
    var vx = voxOf(tr), at = ctx.currentTime + 0.25, words = splitWords(core.clean($("eWords").value)).slice(0, 12);
    var notes = words.map(function (w, i) { return { t: i * 6, l: 6, p: p, w: w }; });
    var dest = tr.x && tr.x.fx ? bus(tr).in : null;
    notes.forEach(function (n, i) {
        var held = i === notes.length - 1, len = held ? 1.4 : 0.34;
        var r = voice.render(ctx, n.w, p + (i % 3 === 2 ? 2 : 0), len, "", vx, notes, n);
        addTest(core.fire(sfx, r.buf, at - r.pre, 0.8, 0, dest));
        at += len + 0.04;
    });
});

$("eReset").addEventListener("click", function () {
    var x = ed.tr.x || {};
    if (ed.tab === "sound") { delete x.fx; }
    if (ed.tab === "voice") { delete x.vx; }
    if (ed.tab === "adv") {
        delete x.ins;
        if (isVox(ed.tr)) { delete x.vx; }
    }
    edChanged();
    edShow(ed.tab);
});

$("eBody").addEventListener("input", function (e) {
    var t = e.target, tr = ed.tr;
    if (t.dataset.fx) {
        xOf(tr).fx = tr.x.fx || {};
        var v = Number(t.value);
        if (v && !(t.dataset.fx === "et" && v === 300)) {
            tr.x.fx[t.dataset.fx] = v;
        } else {
            delete tr.x.fx[t.dataset.fx];
        }
        t.nextElementSibling.textContent = v;
    }
    if (t.dataset.vx) {
        var k = voxKnobs.filter(function (kn) { return kn[0] === t.dataset.vx; })[0];
        xOf(tr).vx = tr.x.vx || {};
        tr.x.vx[k[0]] = Math.round(k[4](Number(t.value)) * 1000) / 1000;
        t.nextElementSibling.textContent = t.value;
    }
});

$("eBody").addEventListener("change", function (e) {
    var t = e.target, tr = ed.tr;
    if (t.dataset.fx || t.dataset.vx) {
        edChanged();
        if (t.dataset.vx) { $("eTest").click(); }
        return;
    }
    if (t.dataset.hd) {
        xOf(tr).vx = tr.x.vx || {};
        tr.x.vx.hd = t.checked ? 1 : 0;
    }
    if (t.dataset.raw) {
        xOf(tr).vx = tr.x.vx || {};
        if (t.value.trim() === "") {
            delete tr.x.vx[t.dataset.raw];
        } else {
            tr.x.vx[t.dataset.raw] = Number(t.value) || 0;
        }
    }
    if (t.id === "ePiece") {
        ed.piece = Number(t.value);
        edAdv();
        return;
    }
    if (t.dataset.len) { ownIns().len = Math.max(0.02, Number(t.value) || 0.3); }
    if (t.dataset.k) {
        var L = ownIns().l[Number(t.dataset.l)], key = t.dataset.k, val = t.value.trim();
        if (t.type === "checkbox") {
            val = t.checked ? 1 : "";
        } else if (t.dataset.t === "list") {
            val = val ? val.split(",").map(function (x) { return Number(x) || 0; }) : "";
        } else if (t.tagName !== "SELECT" && val !== "") {
            val = Number(val) || 0;
        }
        if (val === "" || (Array.isArray(val) && !val.length)) {
            delete L[key];
        } else {
            L[key] = val;
        }
    }
    edChanged();
    edGraph();
});

$("eBody").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    var tr = ed.tr;
    if (b.id === "eRandom") {
        xOf(tr).vx = tr.x.vx || {};
        voxKnobs.forEach(function (k) { tr.x.vx[k[0]] = Math.round(k[4](k[2] + Math.random() * (k[3] - k[2]) * (k[0] === "pt" ? 0.6 : 1)) * 1000) / 1000; });
        tr.x.vx.tb = Math.round(tr.x.vx.tb);
        edChanged();
        edVoice();
        $("eTest").click();
        return;
    }
    if (b.id === "eAddLayer") {
        ownIns().l.push({ w: "sin", g: 0.2, a: 0.01, d: 0.3, s: 0.5, r: 0.1 });
    } else if (b.dataset.drop !== undefined) {
        var ls = ownIns().l;
        if (ls.length > 1) { ls.splice(Number(b.dataset.drop), 1); }
    } else {
        return;
    }
    edChanged();
    edAdv();
});

$("ePitch").addEventListener("change", edGraph);


// Player stage

var openStage = function (i, back) {
    stopPlay();
    shutLyric(true);
    if (stage) { stage(); }
    $("stage").classList.remove("hide");
    $("stageBtn").textContent = back ? "Back to editor" : "Open in editor";
    $("stageSong").value = i;
    $("stageSong").style.display = book.list.length > 1 ? "" : "none";
    stage = pjs.run($("stageCv"), book.list[i]);
};

$("stageSong").addEventListener("change", function () {
    openStage(Number($("stageSong").value), $("stageBtn").textContent === "Back to editor");
    $("stageSong").blur();
});

$("stageBtn").addEventListener("click", function () {
    var i = Number($("stageSong").value);
    if (stage) { stage(); }
    stage = null;
    $("stage").classList.add("hide");
    if (i !== book.at) { pickSong(i); }
    dirty = true;
});


// Top bar

$("playBtn").addEventListener("click", toggle);
$("loopBtn").addEventListener("click", function () { setLoop(!ui.loop); });
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);
$("sideAdd").addEventListener("click", function () {

});


// Single view and full window

var single = function () { return document.body.classList.contains("single"); };

var platform = (function () {
    var ua = navigator.userAgent, pf = navigator.platform || "";
    if (/Android/i.test(ua)) { return "Android"; }
    if (/CriOS|iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(pf) && navigator.maxTouchPoints > 1)) { return "iOS"; }
    if (/Win/i.test(pf)) { return "Windows"; }
    if (/Mac/i.test(pf)) { return "Mac"; }
    if (/CrOS/i.test(ua)) { return "ChromeOS"; }
    if (/Linux/i.test(ua)) { return "Linux"; }
    return "Undefined platform";
})();
var mobile = platform === "Android" || platform === "iOS";

$("trashBtn").addEventListener("click", function () {
    ui.trash = !ui.trash;
    $("trashBtn").classList.toggle("on", ui.trash);
});

var setView = function (v) {
    document.body.dataset.view = v;
    $("viewSel").value = v;
    shutLyric(true);
    dirty = true;
};

var layout = function () {
    var small = window.innerWidth < SMALL_W || window.innerHeight < SMALL_H;
    document.body.classList.toggle("single", small);
    if (!small) { document.body.classList.remove("menu"); }
    HEAD = small ? 64 : 250;
    dirty = true;
};

$("viewSel").addEventListener("change", function () { setView($("viewSel").value); });
$("trackSel").addEventListener("change", function () { setCur(Number($("trackSel").value)); });
$("menuBtn").addEventListener("click", function () { document.body.classList.toggle("menu"); });
document.addEventListener("mousedown", function (e) {
    if (single() && !e.target.closest("#more") && !e.target.closest("#menuBtn")) { document.body.classList.remove("menu"); }
});
window.addEventListener("resize", layout);

// Full window: writes a fresh copy of this page into a new window, carrying the current song.
var fullPage = function () {
    var page = document.documentElement.cloneNode(true);
    var body = page.querySelector("body");
    page.querySelectorAll("[data-dyn]").forEach(function (el) { el.remove(); });
    ["pal", "heads", "mBtns", "trackSel", "songSel", "stageSong"].forEach(function (id) { page.querySelector("#" + id).innerHTML = ""; });
    ["arr", "lanes"].forEach(function (id) { page.querySelector("#" + id).removeAttribute("style"); });
    ["stage", "modal"].forEach(function (id) { page.querySelector("#" + id).className = "hide"; });
    body.removeAttribute("class");
    body.removeAttribute("data-view");
    page.querySelector("#songScript").textContent = "\nvar songs = " + JSON.stringify(book.list) + ";\nvar songAt = " + book.at + ";\nvar popped = true;\n";
    return "<!DOCTYPE html>" + page.outerHTML;
};

// The original page with the current song list written in, so the new window starts from scratch with the music.
var withSongs = function (page) {
    var open = '<script id="songScript">';
    var at = page.indexOf(open);
    var end = page.indexOf("</scr" + "ipt>", at);
    if (at < 0 || end < 0) { return null; }
    var mine = "\nvar startInPlayer = false;\nvar songs = " + JSON.stringify(book.list) + ";\nvar songAt = " + book.at + ";\nvar popped = true;\n";
    return page.slice(0, at + open.length) + mine + page.slice(end);
};

$("fullBtn").addEventListener("click", function () {
    stopPlay();
    var w = window.open();
    if (!w) { return; }
    w.document.write("<p style=\"font: 16px sans-serif\">Opening Songboard...</p>");
    getOrig(function () {
        var html = (orig.text && withSongs(orig.text)) || fullPage();
        w.document.open();
        w.document.write(html);
        w.document.close();
    });
});

$("homeBtn").addEventListener("click", function () {
    if (play.on) { startPlay(0); }
    ui.head = ui.x = 0;
    dirty = true;
});

$("followBtn").addEventListener("click", function () {
    ui.follow = !ui.follow;
    $("followBtn").classList.toggle("on", ui.follow);
});

$("bpm").addEventListener("change", function () {
    song.bpm = clamp(Math.round(Number($("bpm").value)) || 120, 20, 400);
    $("bpm").value = song.bpm;
    if (play.on) { startPlay(nowTick()); }

});

$("snap").addEventListener("change", function () {

});

$("title").addEventListener("input", function () { liveScrub($("title"), false); });
$("title").addEventListener("change", function () {
    liveScrub($("title"), true);
    song.title = $("title").value = core.clean($("title").value.trim());
    commit();
});

$("vel").addEventListener("input", function () {
    ui.vel = Number($("vel").value);
    sel.forEach(function (n) { n.v = ui.vel; });
    dirty = true;
});

$("vel").addEventListener("change", function () {
    if (sel.length) { commit(); }
});


// Start up

(function () {
    var texts = window.songs || (typeof songText === "string" ? [songText] : []);
    document.body.dataset.view = "tracks";
    document.body.classList.toggle("mobile", mobile);
    layout();
    if (window.popped) { $("fullBtn").style.display = "none"; }
    core.setup(sfx);
    book.list = texts.filter(function (t) {
        try {
            titles[t] = core.decode(t).title || "";
            return true;
        } catch (er) {
            console.warn("A song in the page could not be read", er);
            return false;
        }
    });
    if (!book.list.length) { book.list = [core.encode(blank)]; }
    pickSong(window.songAt || 0);
    var ro = new ResizeObserver(function () { dirty = true; });
    [cv.roll, cv.ruler, $("arrBody")].forEach(function (el) { ro.observe(el); });
    requestAnimationFrame(frame);
    if (window.startInPlayer && texts.length && !window.popped) {
        voiceReady(function () { openStage(0, false); });
    }
})();
