<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Songboard</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html, body {
                margin: 0;
                height: 100%;
            }
            body {
                background: rgb(23, 25, 31);
                color: rgb(221, 224, 231);
                font: 13px system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                user-select: none;
            }
            button, select, input {
                font: inherit;
                color: inherit;
            }
            button {
                background: rgb(41, 45, 55);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 5px;
                padding: 4px 9px;
                cursor: pointer;
            }
            button:hover {
                background: rgb(51, 56, 68);
            }
            button.on {
                background: rgb(43, 88, 124);
                border-color: rgb(97, 183, 246);
            }
            button.hi {
                background: rgb(97, 183, 246);
                border-color: rgb(97, 183, 246);
                color: rgb(17, 22, 31);
                font-weight: 600;
            }
            select, input[type="number"], input[type="text"], input:not([type]) {
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 5px;
                padding: 3px 6px;
            }
            input[type="range"] {
                accent-color: rgb(97, 183, 246);
            }
            label {
                display: flex;
                align-items: center;
                gap: 5px;
                color: rgb(141, 148, 163);
            }

            #top {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                background: rgb(30, 33, 40);
                border-bottom: 1px solid rgb(48, 53, 64);
                flex-wrap: wrap;
            }
            .logo {
                font-weight: 700;
                font-size: 15px;
                letter-spacing: 0.3px;
                margin-right: 6px;
                color: rgb(97, 183, 246);
            }
            #playBtn {
                width: 38px;
            }
            #clock {
                font-variant-numeric: tabular-nums;
                background: rgb(19, 21, 26);
                border-radius: 5px;
                padding: 4px 9px;
                min-width: 128px;
                text-align: center;
                color: rgb(171, 232, 151);
            }
            .tag {
                font-size: 11px;
                padding: 3px 7px;
                border-radius: 10px;
                background: rgb(41, 45, 55);
                color: rgb(141, 148, 163);
            }
            .tag.ok {
                background: rgb(43, 74, 52);
                color: rgb(171, 232, 151);
            }
            .tag.off {
                background: rgb(84, 62, 38);
                color: rgb(244, 203, 87);
            }
            #bpm {
                width: 58px;
            }
            #title {
                width: 170px;
            }
            .grow {
                flex: 1;
            }
            #more {
                display: contents;
            }
            .small {
                display: none;
            }
            .sideHd {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .sideHd button {
                padding: 1px 7px;
                font-size: 12px;
            }

            /*
            * Single view: small screens (like a Khan Academy page) show one pane at a time.
            * The top bar picks the pane and track, the rest of the controls live in the menu.
            */
            body.single #top {
                position: relative;
                flex-wrap: nowrap;
                gap: 6px;
                padding: 6px 8px;
            }
            body.single .small {
                display: block;
            }
            body.single .logo {
                display: none;
            }
            body.single #trackSel {
                min-width: 0;
                max-width: 150px;
            }
            body.single #more {
                display: none;
                position: absolute;
                top: 100%;
                right: 6px;
                z-index: 25;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                width: min(260px, calc(100vw - 12px));
                max-height: calc(100vh - 60px);
                overflow-y: auto;
                padding: 10px;
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
            body.single.menu #more {
                display: flex;
            }
            body.single #more .grow {
                display: none;
            }
            body.single #title {
                width: auto;
            }
            body.single #side,
            body.single .corner,
            body.single #heads {
                width: 150px;
            }
            body.single #split {
                display: none;
            }
            body.single[data-view="tracks"] #side,
            body.single[data-view="tracks"] #rollBar,
            body.single[data-view="tracks"] #rollWrap,
            body.single[data-view="notes"] #side,
            body.single[data-view="notes"] #arr,
            body.single[data-view="sounds"] #work {
                display: none;
            }
            body.single[data-view="tracks"] #arr {
                flex: 1;
                height: auto !important;
            }
            body.single[data-view="sounds"] #side {
                width: 100%;
                border-right: none;
            }
            body.single #rollBar {
                flex-wrap: wrap;
                gap: 6px;
                padding: 5px 8px;
            }
            body.single #rollName,
            body.single #rollBar label {
                display: none;
            }
            body.single .sec {
                margin-left: 0;
            }
            body.single .hd .vo {
                width: 34px;
            }
            body.single .hd .pa {
                display: none;
            }
            body.single .hd .is {
                width: 64px;
            }

            #main {
                flex: 1;
                display: flex;
                min-height: 0;
            }
            #side {
                width: 172px;
                background: rgb(27, 30, 37);
                border-right: 1px solid rgb(48, 53, 64);
                overflow-y: auto;
                padding-bottom: 12px;
            }
            .sideHd {
                padding: 9px 10px 4px;
                font-weight: 600;
            }
            .grp {
                padding: 8px 10px 3px;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: rgb(121, 128, 143);
            }
            .pi {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 10px;
                cursor: grab;
            }
            .pi:hover {
                background: rgb(37, 41, 50);
            }
            .pi.on {
                background: rgb(39, 57, 76);
            }
            .sw {
                width: 10px;
                height: 10px;
                border-radius: 3px;
                flex: none;
            }
            .tip {
                padding: 10px;
                color: rgb(121, 128, 143);
                font-size: 12px;
                line-height: 1.4;
            }

            #work {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            #arr {
                height: 36%;
                min-height: 24px;
                display: flex;
                flex-direction: column;
            }
            #arrTop {
                display: flex;
                height: 24px;
                flex: none;
            }
            .corner {
                width: 200px;
                flex: none;
                background: rgb(31, 34, 41);
                border-right: 1px solid rgb(48, 53, 64);
                border-bottom: 1px solid rgb(48, 53, 64);
                display: flex;
                align-items: center;
                padding: 0 6px;
            }
            .corner button {
                padding: 0 8px;
                font-size: 12px;
            }
            #ruler {
                flex: 1;
                min-width: 0;
                height: 24px;
                cursor: text;
            }
            #arrBody {
                flex: 1;
                display: flex;
                overflow-y: auto;
                overflow-x: hidden;
                align-items: flex-start;
            }
            #heads {
                width: 200px;
                flex: none;
                background: rgb(29, 32, 39);
                border-right: 1px solid rgb(48, 53, 64);
            }
            #lanes {
                flex: 1;
                min-width: 0;
                display: block;
            }
            .hd {
                height: 56px;
                display: flex;
                border-bottom: 1px solid rgb(41, 45, 54);
                cursor: pointer;
            }
            .hd.on {
                background: rgb(36, 44, 56);
            }
            .strip {
                width: 6px;
                flex: none;
            }
            .hm {
                flex: 1;
                min-width: 0;
                padding: 5px 6px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .r1, .r2 {
                display: flex;
                align-items: center;
                gap: 3px;
            }
            .nm {
                flex: 1;
                min-width: 0;
                background: transparent !important;
                border: 1px solid transparent !important;
                font-weight: 600;
                padding: 1px 3px !important;
            }
            .nm:focus {
                border-color: rgb(55, 61, 73) !important;
            }
            .r1 button {
                padding: 0 5px;
                font-size: 11px;
                height: 19px;
            }
            .mb.on {
                background: rgb(160, 72, 66);
                border-color: rgb(228, 93, 82);
            }
            .sb.on {
                background: rgb(150, 122, 46);
                border-color: rgb(244, 203, 87);
            }
            .is {
                width: 86px;
                padding: 1px 3px !important;
                font-size: 12px;
            }
            .vo {
                width: 54px;
            }
            .pa {
                width: 36px;
            }
            .hdAdd {
                height: 56px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgb(101, 108, 123);
                font-size: 12px;
                border-bottom: 1px dashed rgb(48, 53, 64);
            }
            .drop {
                outline: 2px dashed rgb(97, 183, 246);
                outline-offset: -2px;
            }

            #split {
                height: 14px;
                background: rgb(36, 40, 49);
                border-top: 1px solid rgb(48, 53, 64);
                border-bottom: 1px solid rgb(48, 53, 64);
                cursor: ns-resize;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            #split::before {
                content: "";
                width: 42px;
                height: 4px;
                border-radius: 2px;
                background: rgb(72, 79, 94);
            }
            #split button {
                padding: 0 6px;
                height: 12px;
                font-size: 8px;
                line-height: 1;
            }
            #rollBar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 5px 10px;
                background: rgb(30, 33, 40);
                border-bottom: 1px solid rgb(48, 53, 64);
                flex: none;
            }
            #rollName {
                font-weight: 600;
                min-width: 120px;
            }
            #vel {
                width: 90px;
            }
            #rollWrap {
                flex: 1;
                position: relative;
                min-height: 0;
            }
            #roll {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
            }
            #lyric {
                position: absolute;
                display: none;
                z-index: 5;
                height: 22px;
                background: rgb(255, 247, 216) !important;
                color: rgb(31, 29, 34) !important;
                border: 2px solid rgb(252, 141, 211) !important;
                border-radius: 4px;
                font-weight: 600;
                padding: 0 4px !important;
                outline: none;
            }
            #lyric.show {
                display: block;
            }

            .sec {
                display: flex;
                gap: 4px;
                margin-left: auto;
            }
            .visPick {
                margin-bottom: 4px;
            }
            #stage {
                position: fixed;
                inset: 0;
                z-index: 30;
                background: rgb(21, 23, 29);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }
            #stage.hide {
                display: none;
            }
            #stageCv {
                width: min(92vw, calc(100vh - 90px));
                height: min(92vw, calc(100vh - 90px));
                border-radius: 10px;
                cursor: pointer;
            }
            #modal {
                position: fixed;
                inset: 0;
                background: rgba(9, 10, 14, 0.66);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 20;
            }
            #modal.hide {
                display: none;
            }
            .box {
                width: min(720px, calc(100% - 32px));
                background: rgb(31, 34, 42);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 10px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
            }
            #mTitle {
                font-size: 16px;
                font-weight: 700;
            }
            #mText {
                color: rgb(171, 177, 191);
                line-height: 1.45;
            }
            #mText .warn {
                color: rgb(244, 203, 87);
            }
            #mArea {
                width: 100%;
                height: 260px;
                resize: vertical;
                background: rgb(20, 22, 27);
                color: rgb(206, 226, 196);
                border: 1px solid rgb(55, 61, 73);
                border-radius: 6px;
                padding: 8px;
                font: 12px ui-monospace, Consolas, monospace;
                word-break: break-all;
                user-select: text;
            }
            #mBtns {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
        </style>
    </head>
    <body>
        <div id="top">
            <div class="logo">Songboard</div>
            <button id="playBtn" title="Play / Stop (Space)">▶</button>
            <select id="viewSel" class="small" title="Which pane to show">
                <option value="tracks">Tracks</option>
                <option value="notes">Notes</option>
                <option value="sounds">Sounds</option>
            </select>
            <select id="trackSel" class="small" title="Track to edit"></select>
            <div class="grow small"></div>
            <button id="menuBtn" class="small" title="Song menu">☰</button>
            <button id="fullBtn" title="Open in a full window">⛶</button>
            <div id="more">
                <button id="homeBtn" title="Back to start (Home)">⏮</button>
                <button id="loopBtn" title="Loop (L). Drag on the ruler to pick a section, otherwise the whole song loops.">Loop</button>
                <button id="followBtn" class="on" title="Scroll with the playhead">Follow</button>
                <span id="voiceTag" class="tag">Voice...</span>
                <div id="clock">1.1.1 · 0:00.0</div>
                <label>BPM <input id="bpm" type="number" min="20" max="400" value="120"></label>
                <label>Snap
                    <select id="snap">
                        <option value="48">Bar</option>
                        <option value="12">1/4</option>
                        <option value="6">1/8</option>
                        <option value="3" selected>1/16</option>
                        <option value="4">1/8 T</option>
                        <option value="2">1/16 T</option>
                        <option value="1">Off</option>
                    </select>
                </label>
                <input id="title" type="text" placeholder="Song title" maxlength="60">
                <div class="grow"></div>
                <button id="undoBtn" title="Ctrl+Z">Undo</button>
                <button id="redoBtn" title="Ctrl+Y">Redo</button>
                <button id="newBtn">New</button>
                <button id="saveBtn" title="Save or load one song in this browser">Save</button>
                <button id="impBtn">Import</button>
                <button id="expBtn">Export Text</button>
                <button id="pjsBtn" class="hi">Export PJS</button>
            </div>
        </div>

        <div id="main">
            <div id="side">
                <div class="sideHd">Instruments <button id="sideAdd" title="Add a track with the picked instrument">+ Track</button></div>
                <div id="pal"></div>
                <div class="tip">Click to hear one. Drag it onto the board to make a track, or onto a track to swap its sound. Double-click also adds a track.</div>
            </div>

            <div id="work">
                <div id="arr">
                    <div id="arrTop">
                        <div class="corner"><button id="addBtn" title="Add a track with the picked instrument">+ Track</button></div>
                        <canvas id="ruler"></canvas>
                    </div>
                    <div id="arrBody">
                        <div id="heads"></div>
                        <canvas id="lanes"></canvas>
                    </div>
                </div>
                <div id="split" title="Drag to resize"><button id="splitUp" title="Bigger piano roll">▲</button><button id="splitDown" title="Bigger track view">▼</button></div>
                <div id="rollBar">
                    <span id="rollName">-</span>
                    <label>Velocity <input id="vel" type="range" min="1" max="127" value="100"></label>
                    <button id="lyrBtn" title="Type a line of lyrics and spread it across notes">Fill lyrics</button>
                    <div class="sec" title="Works on selected notes, or on the section picked on the ruler">
                        <button id="copyBtn" title="Ctrl+C">Copy</button>
                        <button id="pasteBtn" title="Ctrl+V, pastes at the playhead">Paste</button>
                        <button id="dupBtn" title="Ctrl+D">Duplicate</button>
                        <button id="delBtn" title="Delete">Delete</button>
                    </div>
                </div>
                <div id="rollWrap">
                    <canvas id="roll"></canvas>
                    <input id="lyric" type="text" spellcheck="false" autocomplete="off">
                </div>
            </div>
        </div>

        <div id="stage" class="hide">
            <canvas id="stageCv" width="600" height="600"></canvas>
            <button id="stageBtn">Open in editor</button>
        </div>

        <div id="modal" class="hide">
            <div class="box">
                <div id="mTitle"></div>
                <div id="mText"></div>
                <textarea id="mArea" spellcheck="false"></textarea>
                <div id="mBtns"></div>
            </div>
        </div>

        <script>
var random = function () {
    return Math.random();
};

var sfxSrc = function () {
    /**
    *    --- SFX ENGINE ---
    *
    *    Code by SwankyMan
    *   IIFE by LemonTurtle
    *
    * AudioContext made by Squishy
    * Non ES6 and easy to use.
    *
    * Keep credits here. Do not remove.
    * Credits in comments other than here are not necessary.
    *
    **/

    function _SFX () {
        var mode = "value";
        var iife = (function(a) {
            return this[a];
        })(mode[4] + mode.slice(0, 3));

        this.audioCtx = (0, iife)("new(window.AudioContext||window.webkitAudioContext)()");
        this.context = this.audioCtx;

        this.sound = {};
        this.active = [];

        this.master = this.context.createGain();
        this.master.gain.value = 0.4;

        this.eqLow = this.context.createBiquadFilter();
        this.eqMid = this.context.createBiquadFilter();
        this.eqHigh = this.context.createBiquadFilter();

        this.eqLow.type = "lowshelf";
        this.eqMid.type = "peaking";
        this.eqHigh.type = "highshelf";

        this.eqLow.frequency.value = 180;
        this.eqMid.frequency.value = 1100;
        this.eqHigh.frequency.value = 4800;

        this.eqLow.gain.value = 0;
        this.eqMid.gain.value = 0;
        this.eqHigh.gain.value = 0;

        this.eqLow.connect(this.eqMid);
        this.eqMid.connect(this.eqHigh);
        this.eqHigh.connect(this.master);
        this.master.connect(this.context.destination);
    }

    _SFX.prototype = {

        pick: function (v, d) {
            if (!v) { return d; }
            if (v.length === 2) {
                return v[0] + random() * (v[1] - v[0]);
            }
            return v;
        },

        track: function (n) {
            this.active.push(n);
            var self = this;
            n.onended = function () {
                var i = self.active.indexOf(n);
                if (i !== -1) { self.active.splice(i, 1); }
            };
        },

        make: function (ctx, o) {
            var sr = ctx.sampleRate;
            var dur = o.dur || 0.2;
            var len = Math.floor(sr * dur);
            var buf = ctx.createBuffer(1, len, sr);
            var out = buf.getChannelData(0);

            var fq1 = o.freq || 440;
            var fq2 = o.freqTo || fq1;
            var type = o.type || "sine";

            var a = o.attack || 0.01;
            var d = o.decay || 0.1;
            var s = o.sustain;
            if (s === undefined) { s = 0.5; }
            var r = o.release || 0.1;
            var g = o.gain || 0.8;

            var sum = a + d + r;
            if (sum > 1) {
                var k = 1 / sum;
                a *= k;
                d *= k;
                r *= k;
            }

            var wob = o.wobble || null;
            var wobSp = wob ? wob.speed || 5 : 0;
            var wobAmt = wob ? wob.amount || 10 : 0;

            var curF = (random() * 2) - 1;

            for (var i = 0; i < len; i++) {
                var t = i / sr;
                var tn = t / dur;
                var env;

                if (tn < a) {
                    env = tn / a;
                } else if (tn < a + d) {
                    env = 1 - (1 - s) * ((tn - a) / d);
                } else if (tn < 1 - r) {
                    env = s;
                } else {
                    env = s * (1 - ((tn - (1 - r)) / r));
                }

                var f = fq1 + (fq2 - fq1) * tn;

        <script>
var HEAD = 200;
var SMALL_W = 900;
var SMALL_H = 560;
var LANE = 56;
var RUL = 22;
var SAVE = "songboard";

var $ = function (id) { return document.getElementById(id); };

var song = null;
var sel = [];
var clip = null;
var hist = [];
var hpos = -1;
var bufs = {};
var bufCount = 0;
var buses = new Map();
var dirty = true;
var drag = null;
var prevSrc = null;
var ctx = sfx.context;
var stage = null;
var names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
var cv = { ruler: $("ruler"), lanes: $("lanes"), roll: $("roll") };

var ui = {
    cur: 0, x: 0, zx: 2.5, zy: 14, py: 0, snap: 3, len: 12, vel: 100, head: 0,
    loop: false, lo: 0, hi: 0, follow: true, brush: 0, range: null, hp: -1, box: null
};
var play = { on: false, segs: [], sched: 0, start: 0, timer: 0 };


/* ---------- helpers ---------- */

var rgb = function (c, a) {
    return a === undefined ? "rgb(" + c.join(", ") + ")" : "rgba(" + c.join(", ") + ", " + a + ")";
};
var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
var spt = function () { return 60 / (song.bpm * song.res); };
var cur = function () { return song.tracks[ui.cur] || null; };
var insOf = function (tr) { return core.insts[tr.inst] || { n: "Missing", g: "?", c: [120, 120, 120] }; };
var isVox = function (tr) { return !!tr && insOf(tr).k === "vox"; };
var isKit = function (tr) { return !!tr && insOf(tr).k === "kit"; };
var pname = function (p) { return names[p % 12] + (Math.floor(p / 12) - 1); };
var black = function (p) { return [1, 3, 6, 8, 10].indexOf(p % 12) >= 0; };
var snapT = function (t) { return Math.max(0, Math.round(t / ui.snap) * ui.snap); };
var tx = function (t, x0) { return x0 + (t - ui.x) * ui.zx; };
var rollT = function (x) { return ui.x + (x - HEAD) / ui.zx; };
var rollP = function (y) { return 127 - Math.floor((y - RUL + ui.py) / ui.zy); };
var rollY = function (p) { return RUL + (127 - p) * ui.zy - ui.py; };
var byTime = function (a, b) { return a.t - b.t || a.p - b.p; };

var hasSec = function () { return ui.hi > ui.lo; };
var inSec = function (n) { return n.t >= ui.lo && n.t < ui.hi; };
var bar = function () { return song.res * 4; };
var copyNote = function (n) { return { t: n.t, l: n.l, p: n.p, v: n.v, w: n.w || "" }; };
var minOf = function (list, k) { return Math.min.apply(null, list.map(function (n) { return n[k]; })); };

var fit = function (c) {
    var dpr = window.devicePixelRatio || 1;
    var w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {

var clampPy = function (v) {

/*
* Live typing filter. Finished words (followed by a space or hyphen) are checked
* right away, the word still being typed is checked once it is done.
*/
var liveScrub = function (el, all) {
    var v = el.value;
    var tail = all ? "" : v.match(/[^\s-]*$/)[0];
    var parts = v.slice(0, v.length - tail.length).split(/(\s+)/);
    var words = parts.filter(function (p, i) { return i % 2 === 0; });

    var out = "";

/* ---------- history ---------- */

var commit = function () {

    var s = core.encode(song);
    if (!hist[hpos] || hist[hpos].s !== s) {
        hist = hist.slice(0, hpos + 1);
        hist.push({ s: s, c: ui.cur });
        if (hist.length > 300) { hist.shift(); }
        hpos = hist.length - 1;
    }
    dirty = true;
};

var load = function (s, c) {
    song = typeof s === "string" ? core.decode(s) : s;
    sel = [];
    resetBuses();
    ui.cur = clamp(c || 0, 0, Math.max(0, song.tracks.length - 1));
    $("bpm").value = song.bpm;
    $("title").value = song.title || "";

};

var fresh = function (s) {
    stopPlay();
    load(s, 0);
    ui.head = ui.x = ui.lo = ui.hi = 0;
    setLoop(false);
    commit();
};

var undo = function () {
    if (hpos > 0) {
        hpos--;
        load(hist[hpos].s, hist[hpos].c);
    }
};

var redo = function () {
    if (hpos < hist.length - 1) {
        hpos++;
        load(hist[hpos].s, hist[hpos].c);
    }
};


/* ---------- audio ---------- */

var bus = function (tr) {
    var b = buses.get(tr);
    if (!b) {
        b = { g: ctx.createGain(), p: ctx.createStereoPanner() };
        b.g.connect(b.p);
        b.p.connect(sfx.eqLow);
        buses.set(tr, b);
    }
    return b;
};

var resetBuses = function () {
    buses.forEach(function (b) { b.p.disconnect(); });
    buses = new Map();
};

var mixAll = function () {
    var solo = anySolo();
    song.tracks.forEach(function (tr) {
        var b = bus(tr);
        var on = !tr.mute && (!solo || tr.solo);
        b.g.gain.setTargetAtTime(on ? tr.vol / 100 : 0, ctx.currentTime, 0.01);
        b.p.pan.value = tr.pan / 50;
    });

var keep = function (key, make, peek) {
    if (bufs[key] === undefined) {
        if (peek) { return null; }
        if (bufCount++ > 3000) {
            bufs = {};
            bufCount = 0;
        }
        bufs[key] = make();
    }
    return bufs[key];
};

var prevWord = function (tr, n) {
    var best = null;
    tr.notes.forEach(function (o) {
        if (o.t < n.t && !voice.held(o.w) && (!best || o.t > best.t)) { best = o; }
    });
    return best ? best.w : "";
};

var getBuf = function (tr, n, sec, peek) {
    var ins = insOf(tr);
    if (ins.k === "vox") {
        if (!window.voice) { return null; }
        var pw = voice.held(n.w) ? prevWord(tr, n) : "";
        var ch = ins.vx.hd ? voice.chain(tr.notes, n) : null;
        var key = "v" + tr.inst + ":" + n.w + ":" + pw + ":" + (ch ? ch.word + ch.part : "") + ":" + (voice.big ? 1 : 0);
        return keep(key + ":" + n.p + ":" + Math.round(sec * 1000), function () {
            return voice.render(ctx, n.w, n.p, sec, pw, ins.vx, tr.notes, n);
        }, peek);
    }
    return keep(core.key(tr.inst, n.p, sec), function () {
        return { buf: core.render(ctx, core.insts[tr.inst], n.p, sec), pre: 0 };
    }, peek);
};

/*
* Sounds are built a little at a time. Khan Academy stops any script that keeps
* looping for too long in one go, so nothing here runs for more than ~25ms at once.
*/
var warm = { list: [], at: 0, timer: 0, wait: null };

var warmUp = function (from, ready) {
    var list = [];
    song.tracks.forEach(function (tr) {
        tr.notes.forEach(function (n) {
            if (n.t + n.l > from) { list.push({ tr: tr, n: n }); }
        });
    });
    list.sort(function (a, b) { return a.n.t - b.n.t; });
    clearTimeout(warm.timer);
    warm.list = list;
    warm.at = 0;
    warm.wait = { until: from + 2 / spt(), fn: ready };

var warmStep = function () {
    var t0 = performance.now();
    while (warm.at < warm.list.length && performance.now() - t0 < 25) {
        var w = warm.list[warm.at];
        getBuf(w.tr, w.n, w.n.l * spt());
        warm.at++;
    }
    var w2 = warm.list[warm.at];
    if (warm.wait && (!w2 || w2.n.t > warm.wait.until)) {

        warm.wait = null;
        fn();
    }

};

var preview = function (inst, p, w) {
    var ins = core.insts[inst];
    if (!ins || (ins.k === "vox" && !window.voice)) { return; }
    ctx.resume();
    try {
        if (prevSrc) { prevSrc.stop(); }
    } catch (er) {

    }

    });

};

var schedule = function (a, b, sg) {
    var sp = spt();
    var t0 = performance.now();
    song.tracks.forEach(function (tr) {
        tr.notes.forEach(function (n) {
            if (n.t < a || n.t >= b) { return; }
            var r = getBuf(tr, n, n.l * sp, performance.now() - t0 > 120);
            if (r && r.buf) { core.fire(sfx, r.buf, sg.base + (n.t - sg.from) * sp - r.pre, n.v / 127, 0, bus(tr).g); }

var tick = function () {

var nowTick = function () {

    var sg = play.segs[0];
    play.segs.forEach(function (s) {

    });

var stopPlay = function () {
    if (warm.wait) {

        $("playBtn").classList.remove("on");

/* ---------- drawing ---------- */

var drRuler = function (g, x0, w, h) {
    g.fillStyle = "rgb(31, 34, 41)";
    g.fillRect(x0, 0, w, h);
    if (hasSec()) {
        var la = Math.max(x0, tx(ui.lo, x0));
        g.fillStyle = ui.loop ? "rgba(97, 183, 246, 0.42)" : "rgba(244, 203, 87, 0.3)";
        g.fillRect(la, 0, Math.max(0, tx(ui.hi, x0) - la), h);
    }
    var b = bar(), every = 1;
    while (every * b * ui.zx < 46) { every *= 2; }
    g.font = "11px system-ui, sans-serif";
    g.textBaseline = "middle";
    for (var n = Math.floor(ui.x / b); ; n++) {
        var x = tx(n * b, x0);
        if (x > x0 + w) { break; }
        for (var k = 1; k < 4 && song.res * ui.zx >= 7; k++) {
            g.fillStyle = "rgb(70, 76, 90)";
            if (x + k * song.res * ui.zx > x0) { g.fillRect(Math.round(x + k * song.res * ui.zx), h - 5, 1, 5); }
        }
        if (x < x0) { continue; }
        g.fillStyle = n % every === 0 ? "rgb(98, 106, 122)" : "rgb(70, 76, 90)";
        g.fillRect(Math.round(x), n % every === 0 ? 0 : h - 9, 1, h);
        if (n % every === 0) {
            g.fillStyle = "rgb(181, 187, 200)";
            g.fillText(String(n + 1), x + 4, h / 2);
        }
    }
    g.fillStyle = "rgb(48, 53, 64)";
    g.fillRect(x0, h - 1, w, 1);
};

var drHead = function (g, x0, h) {
    var x = tx(nowTick(), x0);
    if (x >= x0) {
        g.fillStyle = "rgb(252, 214, 105)";
        g.fillRect(Math.round(x), 0, 1.5, h);
    }
};

var drGrid = function (g, x0, w, y0, h) {
    var b = bar();
    var steps = [ui.snap, song.res, b, b * 4, b * 16, b * 64];
    var step = steps.filter(function (s) { return s * ui.zx >= 8; })[0] || b * 64;
    for (var t = Math.floor(ui.x / step) * step; tx(t, x0) <= x0 + w; t += step) {
        if (tx(t, x0) < x0) { continue; }
        g.fillStyle = t % b === 0 ? "rgba(160, 170, 190, 0.22)" : (t % song.res === 0 ? "rgba(160, 170, 190, 0.1)" : "rgba(160, 170, 190, 0.05)");
        g.fillRect(Math.round(tx(t, x0)), y0, 1, h);
    }
    if (hasSec()) {
        var la = Math.max(x0, tx(ui.lo, x0));
        g.fillStyle = ui.loop ? "rgba(97, 183, 246, 0.07)" : "rgba(244, 203, 87, 0.06)";
        g.fillRect(la, y0, Math.max(0, tx(ui.hi, x0) - la), h);
    }
};

var drTop = function () {
    var c = fit(cv.ruler);
    drRuler(c.g, 0, c.w, c.h);
    drHead(c.g, 0, c.h);
};

var drLanes = function () {
    var want = Math.max(song.tracks.length * LANE + LANE, $("arrBody").clientHeight);
    if (cv.lanes.clientHeight !== want) { cv.lanes.style.height = want + "px"; }
    var c = fit(cv.lanes);
    var g = c.g;
    var solo = anySolo();
    g.fillStyle = "rgb(25, 27, 33)";
    g.fillRect(0, 0, c.w, c.h);
    song.tracks.forEach(function (tr, i) {
        g.fillStyle = i === ui.cur ? "rgb(33, 39, 50)" : (i % 2 ? "rgb(27, 30, 36)" : "rgb(29, 32, 38)");
        g.fillRect(0, i * LANE, c.w, LANE);
    });
    drGrid(g, 0, c.w, 0, c.h);
    song.tracks.forEach(function (tr, i) {
        var y = i * LANE, mn = 127, mx = 0;
        tr.notes.forEach(function (n) {
            mn = Math.min(mn, n.p);
            mx = Math.max(mx, n.p);
        });
        var span = Math.max(12, mx - mn + 1);
        var top = mn + (span - (mx - mn + 1)) / 2 + span - 1;
        var nh = Math.max(2, (LANE - 12) / span);
        g.fillStyle = rgb(insOf(tr).c, tr.mute || (solo && !tr.solo) ? 0.3 : 0.9);
        tr.notes.forEach(function (n) {
            var x = tx(n.t, 0), w = Math.max(2, n.l * ui.zx - 1);
            if (x < c.w && x + w > 0) { g.fillRect(x, y + 6 + (top - n.p) / span * (LANE - 12), w, nh); }
        });
        g.fillStyle = "rgb(41, 45, 54)";
        g.fillRect(0, y + LANE - 1, c.w, 1);
    });
    if (ui.range) {
        var ra = Math.min(ui.range.a, ui.range.b), rb = Math.max(ui.range.a, ui.range.b);
        g.fillStyle = "rgba(255, 255, 255, 0.1)";
        g.fillRect(tx(ra, 0), ui.range.row * LANE, (rb - ra) * ui.zx, LANE);
    }
    drHead(g, 0, c.h);
};

var drNote = function (g, n, x, y, w, color, on, label) {
    g.fillStyle = on ? "rgba(255, 255, 255, 0.92)" : color;
    g.beginPath();
    if (g.roundRect) {
        g.roundRect(x, y + 1, w, ui.zy - 2, 3);
    } else {
        g.rect(x, y + 1, w, ui.zy - 2);
    }
    g.fill();
    g.fillStyle = "rgba(0, 0, 0, 0.35)";
    g.fillRect(x + w - 3, y + 3, 2, ui.zy - 6);
    if (label && ui.zy >= 11) {
        g.save();
        g.beginPath();
        g.rect(x, y, w - 4, ui.zy);
        g.clip();
        g.fillStyle = "rgb(30, 22, 34)";
        g.fillText(n.w || "·", x + 4, y + ui.zy / 2 + 0.5);
        g.restore();
    }
};

var drRoll = function () {
    var c = fit(cv.roll);
    var g = c.g, w = c.w, h = c.h;
    var tr = cur(), ins = tr ? insOf(tr) : null, kit = isKit(tr);
    var pTop = Math.min(127, rollP(RUL));
    var seen = function (n) {
        var x = tx(n.t, HEAD), y = rollY(n.p);
        return x < w && x + n.l * ui.zx > HEAD && y < h && y + ui.zy > RUL;
    };
    ui.py = clampPy(ui.py);
    g.fillStyle = "rgb(25, 27, 33)";
    g.fillRect(0, 0, w, h);
    for (var p = pTop; p >= 0 && rollY(p) <= h; p--) {
        if (kit) {
            g.fillStyle = ins.kit[p] ? "rgb(36, 40, 49)" : "rgb(23, 25, 30)";
        } else {
            g.fillStyle = black(p) ? "rgb(26, 28, 34)" : "rgb(32, 35, 43)";
        }
        g.fillRect(HEAD, rollY(p), w - HEAD, ui.zy);
        if (p % 12 === 0) {
            g.fillStyle = "rgb(48, 53, 64)";
            g.fillRect(HEAD, rollY(p) + ui.zy - 1, w - HEAD, 1);
        }
    }
    drGrid(g, HEAD, w - HEAD, RUL, h - RUL);

    song.tracks.forEach(function (o, i) {
        if (i === ui.cur || isKit(o) || kit) { return; }
        g.fillStyle = rgb(insOf(o).c, 0.16);
        o.notes.forEach(function (n) {
            if (seen(n)) { g.fillRect(tx(n.t, HEAD), rollY(n.p) + 1, Math.max(2, n.l * ui.zx - 1), ui.zy - 2); }
        });
    });
    if (tr) {
        g.font = "600 " + Math.min(12, ui.zy - 2) + "px system-ui, sans-serif";
        g.textBaseline = "middle";
        tr.notes.forEach(function (n) {
            if (!seen(n)) { return; }
            drNote(g, n, tx(n.t, HEAD), rollY(n.p), Math.max(3, n.l * ui.zx - 1), rgb(ins.c, 0.5 + 0.5 * n.v / 127), sel.indexOf(n) >= 0, isVox(tr));
        });
    }
    if (ui.box) {
        var b = ui.box;
        g.fillStyle = "rgba(97, 183, 246, 0.12)";
        g.strokeStyle = "rgb(97, 183, 246)";
        g.fillRect(Math.min(b.x0, b.x1), Math.min(b.y0, b.y1), Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
        g.strokeRect(Math.min(b.x0, b.x1) + 0.5, Math.min(b.y0, b.y1) + 0.5, Math.abs(b.x1 - b.x0), Math.abs(b.y1 - b.y0));
    }

    g.fillStyle = "rgb(21, 23, 28)";
    g.fillRect(0, RUL, HEAD, h - RUL);
    g.font = "11px system-ui, sans-serif";
    for (var q = pTop; q >= 0 && rollY(q) <= h; q--) {
        var ky = rollY(q), hot = q === ui.hp;
        if (kit) {
            var pc = ins.kit[q];
            g.fillStyle = hot ? "rgb(66, 74, 90)" : (pc ? "rgb(44, 49, 60)" : "rgb(27, 29, 35)");
            g.fillRect(0, ky, HEAD - 1, ui.zy - 1);
            if (pc && ui.zy >= 9) {
                g.fillStyle = rgb(ins.c);
                g.fillText(pc.n, 10, ky + ui.zy / 2);
            }
            continue;
        }
        g.fillStyle = hot ? "rgb(150, 205, 248)" : "rgb(222, 225, 231)";
        g.fillRect(HEAD - Math.min(70, HEAD), ky, Math.min(69, HEAD - 1), ui.zy - 0.5);
        if (black(q)) {
            g.fillStyle = hot ? "rgb(70, 120, 170)" : "rgb(30, 32, 38)";
            g.fillRect(HEAD - Math.min(70, HEAD), ky + 1, Math.min(42, HEAD * 0.6), ui.zy - 2);
        }
        if (q % 12 === 0 && ui.zy >= 9) {
            g.fillStyle = HEAD > 110 ? "rgb(141, 148, 163)" : "rgb(30, 32, 38)";
            g.fillText(pname(q), HEAD > 110 ? HEAD - 104 : HEAD - 24, ky + ui.zy / 2);
        }
    }
    drRuler(g, HEAD, w - HEAD, RUL);
    g.fillStyle = "rgb(31, 34, 41)";
    g.fillRect(0, 0, HEAD, RUL);
    g.fillStyle = tr ? rgb(ins.c) : "rgb(141, 148, 163)";
    g.font = "600 12px system-ui, sans-serif";
    if (HEAD > 110) { g.fillText(tr ? tr.name : "No track", 8, RUL / 2); }
    g.fillStyle = "rgb(48, 53, 64)";
    g.fillRect(0, RUL - 1, HEAD, 1);
    g.fillRect(HEAD - 1, 0, 1, h);
    drHead(g, HEAD, h);
};

var drClock = function () {
    var t = nowTick(), sec = t * spt();
    var where = (Math.floor(t / bar()) + 1) + "." + (Math.floor((t % bar()) / song.res) + 1) + "." + (Math.floor((t % song.res) / (song.res / 4)) + 1);
    var s = (sec % 60).toFixed(1);
    $("clock").textContent = where + " · " + Math.floor(sec / 60) + ":" + (s < 10 ? "0" : "") + s;
};

var frame = function () {
    if (play.on) {
        var t = nowTick();
        var vis = (cv.roll.clientWidth - HEAD) / ui.zx;
        if (ui.follow && !drag && (t > ui.x + vis * 0.92 || t < ui.x)) { ui.x = Math.max(0, t - vis * 0.05); }
        dirty = true;
    }
    if (dirty && !stage) {
        dirty = false;
        drTop();
        drLanes();
        drRoll();
        drClock();
    }
    requestAnimationFrame(frame);
};


/* ---------- tracks ---------- */

var instOpts = core.insts.map(function (ins, i) {
    var head = i === 0 || core.insts[i - 1].g !== ins.g;
    return (head && i ? "</optgroup>" : "") + (head ? '<optgroup label="' + ins.g + '">' : "") + '<option value="' + i + '">' + ins.n + "</option>";
}).join("") + "</optgroup>";

var nameBar = function () {
    $("trackSel").innerHTML = song.tracks.map(function (tr, i) {
        return '<option value="' + i + '">' + (i + 1) + ". " + tr.name.replace(/</g, "&lt;") + "</option>";
    }).join("");
    $("trackSel").value = ui.cur;
    $("rollName").textContent = cur() ? cur().name + " · " + insOf(cur()).n : "No track";
    $("lyrBtn").style.display = isVox(cur()) ? "" : "none";
};

var renderHeads = function () {
    var box = $("heads");
    box.innerHTML = "";
    song.tracks.forEach(function (tr, i) {
        var d = document.createElement("div");
        d.className = "hd" + (i === ui.cur ? " on" : "");
        d.dataset.i = i;
        d.innerHTML = '<div class="strip" style="background:' + rgb(insOf(tr).c) + '"></div><div class="hm"><div class="r1">' +
            '<input class="nm" type="text" maxlength="40">' +
            '<button class="mb' + (tr.mute ? " on" : "") + '" data-a="mute" title="Mute">M</button>' +
            '<button class="sb' + (tr.solo ? " on" : "") + '" data-a="solo" title="Solo">S</button>' +
            '<button data-a="del" title="Delete track">✕</button></div><div class="r2">' +
            '<select class="is" title="Instrument">' + instOpts + "</select>" +
            '<input class="vo" type="range" min="0" max="100" title="Volume">' +
            '<input class="pa" type="range" min="-50" max="50" title="Pan"></div></div>';
        d.querySelector(".nm").value = tr.name;
        d.querySelector(".is").value = tr.inst;
        d.querySelector(".vo").value = tr.vol;
        d.querySelector(".pa").value = tr.pan;
        box.appendChild(d);
    });
    var add = document.createElement("div");
    add.className = "hdAdd";
    add.textContent = "+ drop instrument here";
    box.appendChild(add);
    nameBar();
    dirty = true;
};

var focusTrack = function () {
    var tr = cur();
    if (!tr) { return; }
    var mid = 66;
    if (isKit(tr)) {
        var keys = Object.keys(insOf(tr).kit).map(Number);
        mid = (Math.min.apply(null, keys) + Math.max.apply(null, keys)) / 2;
    } else if (tr.notes.length) {
        mid = tr.notes.reduce(function (a, n) { return a + n.p; }, 0) / tr.notes.length;
    }
    ui.py = clampPy((127 - mid) * ui.zy - (cv.roll.clientHeight - RUL) / 2);
};

var setCur = function (i) {
    if (i === ui.cur && cur()) { return; }
    shutLyric(true);
    sel = [];
    ui.range = null;
    ui.cur = i;
    $("heads").querySelectorAll(".hd").forEach(function (d, k) { d.classList.toggle("on", k === i); });
    nameBar();
    focusTrack();
    dirty = true;
};

var addTrack = function (inst) {
    var ins = core.insts[inst];
    song.tracks.push({ inst: inst, name: ins.n, vol: ins.k === "kit" ? 85 : 75, pan: 0, mute: false, solo: false, notes: [] });
    ui.cur = -1;
    renderHeads();
    setCur(song.tracks.length - 1);
    mixAll();
    commit();
    $("arrBody").scrollTop = $("arrBody").scrollHeight;
};

var setInst = function (tr, inst) {
    if (tr.name === insOf(tr).n) { tr.name = core.insts[inst].n; }
    tr.inst = inst;
    renderHeads();
    focusTrack();
    commit();
};

var delTrack = function (i) {
    var b = buses.get(song.tracks[i]);
    if (b) { b.p.disconnect(); }
    song.tracks.splice(i, 1);
    sel = [];
    ui.cur = clamp(ui.cur >= i ? ui.cur - 1 : ui.cur, 0, Math.max(0, song.tracks.length - 1));
    renderHeads();
    mixAll();
    commit();
};


/* ---------- palette and drag and drop ---------- */

core.insts.forEach(function (ins, i) {
    if (i === 0 || core.insts[i - 1].g !== ins.g) {
        var gd = document.createElement("div");
        gd.className = "grp";
        gd.textContent = ins.g;

    }

    d.innerHTML = '<span class="sw" style="background:' + rgb(ins.c) + '"></span><span></span>';
    d.lastChild.textContent = ins.n;
    $("pal").appendChild(d);
});

$("pal").addEventListener("click", function (e) {
    var d = e.target.closest(".pi");
    if (!d) { return; }
    ui.brush = Number(d.dataset.i);
    $("pal").querySelectorAll(".pi").forEach(function (o) { o.classList.toggle("on", o === d); });
    var ins = core.insts[ui.brush];
    preview(ui.brush, ins.k === "kit" ? Number(Object.keys(ins.kit)[1]) : (ins.k === "vox" ? 64 : 60), "la");
});

$("pal").addEventListener("dblclick", function (e) {
    var d = e.target.closest(".pi");
    if (d) { addTrack(Number(d.dataset.i)); }
});

$("pal").addEventListener("dragstart", function (e) {
    var d = e.target.closest(".pi");

});

$("arrBody").addEventListener("dragover", function (e) {
    e.preventDefault();
    $("arrBody").classList.add("drop");
});

$("arrBody").addEventListener("dragleave", function () { $("arrBody").classList.remove("drop"); });

$("arrBody").addEventListener("drop", function (e) {
    e.preventDefault();
    $("arrBody").classList.remove("drop");
    var data = e.dataTransfer.getData("text/plain");
    if (data.indexOf("inst:") !== 0) { return; }
    var row = Math.floor((e.clientY - $("heads").getBoundingClientRect().top) / LANE);
    if (row >= 0 && row < song.tracks.length) {
        setCur(row);
        setInst(song.tracks[row], Number(data.slice(5)));

        addTrack(Number(data.slice(5)));
    }
});


/* ---------- track header events ---------- */

var headOf = function (el) {
    var d = el.closest(".hd");
    return d ? song.tracks[Number(d.dataset.i)] : null;
};

$("heads").addEventListener("mousedown", function (e) {
    var d = e.target.closest(".hd");
    if (d) { setCur(Number(d.dataset.i)); }
});

$("heads").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    var tr = headOf(e.target);
    if (!b || !tr) { return; }
    if (b.dataset.a === "del") {
        delTrack(song.tracks.indexOf(tr));
        return;
    }
    tr[b.dataset.a] = !tr[b.dataset.a];
    b.classList.toggle("on", tr[b.dataset.a]);
    mixAll();
    commit();
});

$("heads").addEventListener("input", function (e) {
    var tr = headOf(e.target);
    var cl = e.target.classList;
    if (!tr) { return; }
    if (cl.contains("vo")) { tr.vol = Number(e.target.value); }
    if (cl.contains("pa")) { tr.pan = Number(e.target.value); }
    if (cl.contains("nm")) { liveScrub(e.target, false); }
    mixAll();
    dirty = true;
});

$("heads").addEventListener("change", function (e) {
    var tr = headOf(e.target);
    if (!tr) { return; }
    if (e.target.classList.contains("is")) {
        setInst(tr, Number(e.target.value));
        return;
    }
    if (e.target.classList.contains("nm")) {
        liveScrub(e.target, true);
        tr.name = core.clean(e.target.value.trim()) || insOf(tr).n;
        e.target.value = tr.name;
        nameBar();
    }
    commit();
});

$("heads").addEventListener("dblclick", function (e) {
    var cl = e.target.classList;
    if (!cl.contains("vo") && !cl.contains("pa")) { return; }
    e.target.value = cl.contains("vo") ? 75 : 0;
    e.target.dispatchEvent(new Event("input", { bubbles: true }));
    e.target.dispatchEvent(new Event("change", { bubbles: true }));
});


/* ---------- note editing ---------- */

var rollPos = function (e) {
    var r = cv.roll.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
};

var hitNote = function (tr, x, y) {
    if (!tr || y < RUL || x < HEAD) { return null; }
    var p = rollP(y);
    for (var i = tr.notes.length - 1; i >= 0; i--) {
        var n = tr.notes[i];
        if (n.p === p && x >= tx(n.t, HEAD) && x <= tx(n.t, HEAD) + Math.max(3, n.l * ui.zx)) { return n; }
    }
    return null;
};

var nearEdge = function (n, x) {
    var w = Math.max(3, n.l * ui.zx);
    return x > tx(n.t, HEAD) + w - Math.min(7, w / 3);
};

var removeNotes = function (tr, list) {
    tr.notes = tr.notes.filter(function (n) { return list.indexOf(n) < 0; });
    sel = sel.filter(function (n) { return list.indexOf(n) < 0; });
};

var startPan = function (e, roll) {
    e.preventDefault();
    drag = { k: "pan", roll: roll, cx: e.clientX, cy: e.clientY, ux: ui.x, upy: ui.py };
};

[cv.roll, cv.lanes, cv.ruler].forEach(function (c) {
    c.addEventListener("contextmenu", function (e) { e.preventDefault(); });
});

var rulerDown = function (e, xr) {
    drag = { k: "ruler", x0: e.clientX - xr, cx: e.clientX, a: snapT(ui.x + xr / ui.zx), moved: false };
};

cv.ruler.addEventListener("mousedown", function (e) {
    if (e.button === 1) { startPan(e, false); }
    if (e.button === 0) { rulerDown(e, e.clientX - cv.ruler.getBoundingClientRect().left); }
});

cv.roll.addEventListener("mousedown", function (e) {
    var m = rollPos(e);
    var tr = cur();
    shutLyric(true);
    if (e.button === 1) { return startPan(e, true); }
    if (m.y < RUL) {
        if (m.x >= HEAD && e.button === 0) { rulerDown(e, m.x - HEAD); }
        return;
    }
    if (!tr) { return; }
    if (m.x < HEAD) {
        drag = { k: "key", p: rollP(m.y) };
        preview(tr.inst, drag.p, "la");
        return;
    }
    var tk = rollT(m.x), p = clamp(rollP(m.y), 0, 127);
    var hit = hitNote(tr, m.x, m.y);
    dirty = true;
    if (e.button === 2) {
        drag = { k: "erase", hit: !!hit };
        if (hit) { removeNotes(tr, [hit]); }
        return;
    }
    if (e.button !== 0) { return; }
    if (!hit && e.shiftKey) {
        sel = [];
        ui.box = { x0: m.x, y0: m.y, x1: m.x, y1: m.y };
        drag = { k: "box" };
        return;
    }
    if (!hit) {
        var n = { t: Math.max(0, Math.floor(tk / ui.snap) * ui.snap), l: isKit(tr) ? Math.max(ui.snap, 3) : ui.len, p: p, v: ui.vel, w: "" };
        tr.notes.push(n);
        sel = [n];
        drag = { k: "size", fresh: true, t0: tk, cx: m.x, orig: [{ n: n, t: n.t, l: n.l, p: n.p }], ref: n, moved: true };
        preview(tr.inst, p, "la");
        return;
    }
    if (e.shiftKey) {
        if (sel.indexOf(hit) >= 0) {
            sel.splice(sel.indexOf(hit), 1);
        } else {
            sel.push(hit);
        }
        return;
    }
    if (sel.indexOf(hit) < 0) { sel = [hit]; }
    var made = e.ctrlKey || e.metaKey;
    if (made) {
        var copies = sel.map(copyNote);
        tr.notes = tr.notes.concat(copies);
        hit = copies[sel.indexOf(hit)];
        sel = copies;
    }
    ui.vel = $("vel").value = hit.v;
    var edge = !made && nearEdge(hit, m.x);
    var orig = sel.map(function (o) { return { n: o, t: o.t, l: o.l, p: o.p }; });
    drag = {
        k: edge ? "size" : "move", t0: tk, p0: p, cx: m.x, orig: orig, ref: hit, lp: hit.p, moved: made,
        minT: minOf(orig, "t"), minP: minOf(orig, "p"), maxP: maxOf(orig, "p")
    };
    if (!edge) { preview(tr.inst, hit.p, hit.w); }
});

cv.roll.addEventListener("mousemove", function (e) {
    if (drag) { return; }
    var m = rollPos(e);
    var hp = m.y >= RUL ? rollP(m.y) : -1;
    var hit = hitNote(cur(), m.x, m.y);
    if (hp !== ui.hp) {
        ui.hp = hp;
        dirty = true;
    }
    if (m.y < RUL) {
        cv.roll.style.cursor = "text";
    } else if (m.x < HEAD) {
        cv.roll.style.cursor = "pointer";
    } else if (hit) {
        cv.roll.style.cursor = nearEdge(hit, m.x) ? "ew-resize" : "move";
    } else {
        cv.roll.style.cursor = "crosshair";
    }
});

cv.roll.addEventListener("mouseleave", function () {
    ui.hp = -1;
    dirty = true;
});

cv.roll.addEventListener("dblclick", function (e) {
    var m = rollPos(e);
    var hit = hitNote(cur(), m.x, m.y);
    if (hit && isVox(cur())) { openLyric(hit); }
});

cv.lanes.addEventListener("mousedown", function (e) {
    var r = cv.lanes.getBoundingClientRect();
    var row = Math.floor((e.clientY - r.top) / LANE);
    if (e.button === 1) { return startPan(e, false); }
    if (e.button !== 0 || row >= song.tracks.length) { return; }
    setCur(row);
    var t = snapT(ui.x + (e.clientX - r.left) / ui.zx);
    drag = { k: "range", cx: r.left, row: row };
    ui.range = { row: row, a: t, b: t };
    dirty = true;
});

cv.lanes.addEventListener("dblclick", function (e) {
    var row = Math.floor((e.clientY - cv.lanes.getBoundingClientRect().top) / LANE);
    if (single() && row < song.tracks.length) {
        setView("notes");
        return;
    }
    if (Math.floor((e.clientY - cv.lanes.getBoundingClientRect().top) / LANE) >= song.tracks.length) { addTrack(ui.brush); }
});

$("split").addEventListener("mousedown", function (e) {
    if (e.target.tagName === "BUTTON") { return; }
    drag = { k: "split", y0: e.clientY, h0: $("arr").offsetHeight };
    e.preventDefault();
});

var setSplit = function (h) {
    $("arr").style.height = clamp(h, 24, $("work").clientHeight - $("rollBar").offsetHeight - 30) + "px";
    dirty = true;
};

$("splitUp").addEventListener("click", function () { setSplit($("arr").offsetHeight > 140 ? 120 : 24); });
$("splitDown").addEventListener("click", function () { setSplit($("arr").offsetHeight < $("work").clientHeight * 0.5 ? $("work").clientHeight * 0.62 : 9999); });

var moves = {
    ruler: function (e) {
        if (Math.abs(e.clientX - drag.cx) < 4 && !drag.moved) { return; }
        var b = snapT(ui.x + (e.clientX - drag.x0) / ui.zx);
        drag.moved = true;
        sel = [];
        ui.lo = Math.min(drag.a, b);
        ui.hi = Math.max(drag.a, b);
    },
    pan: function (e) {
        ui.x = Math.max(0, drag.ux - (e.clientX - drag.cx) / ui.zx);
        if (drag.roll) { ui.py = clampPy(drag.upy - (e.clientY - drag.cy)); }
    },
    split: function (e) { setSplit(drag.h0 + e.clientY - drag.y0); },
    key: function (e, m) {
        if (rollP(m.y) !== drag.p && m.x < HEAD && cur()) {
            drag.p = ui.hp = rollP(m.y);
            preview(cur().inst, drag.p, "la");
        }
    },
    move: function (e, m) {
        var dt = Math.max(Math.round((rollT(m.x) - drag.t0) / ui.snap) * ui.snap, -drag.minT);
        var dp = clamp(clamp(rollP(m.y), 0, 127) - drag.p0, -drag.minP, 127 - drag.maxP);
        drag.orig.forEach(function (o) {
            o.n.t = o.t + dt;
            o.n.p = o.p + dp;
        });
        drag.moved = drag.moved || !!(dt || dp);
        if (drag.ref.p !== drag.lp) {
            drag.lp = drag.ref.p;
            preview(cur().inst, drag.ref.p, drag.ref.w);
        }
    },
    size: function (e, m) {
        var tk = rollT(m.x);
        if (drag.fresh) {
            if (Math.abs(m.x - drag.cx) <= 3) { return; }
            drag.ref.l = ui.len = Math.max(drag.ref.t + ui.snap, Math.ceil(tk / ui.snap) * ui.snap) - drag.ref.t;
            return;
        }
        var d = Math.round((tk - drag.t0) / ui.snap) * ui.snap;
        drag.orig.forEach(function (o) { o.n.l = Math.max(1, o.l + d); });
        if (d) {
            drag.moved = true;
            ui.len = drag.ref.l;
        }
    },
    erase: function (e, m) {
        var hit = hitNote(cur(), m.x, m.y);
        if (hit) {
            removeNotes(cur(), [hit]);
            drag.hit = true;
        }
    },
    box: function (e, m) {
        var b = ui.box;
        b.x1 = m.x;
        b.y1 = m.y;
        var t1 = rollT(Math.min(b.x0, b.x1)), t2 = rollT(Math.max(b.x0, b.x1));
        var p1 = rollP(Math.max(b.y0, b.y1)), p2 = rollP(Math.min(b.y0, b.y1));
        sel = cur() ? cur().notes.filter(function (q) { return q.t < t2 && q.t + q.l > t1 && q.p >= p1 && q.p <= p2; }) : [];
    },
    range: function (e) {
        ui.range.b = snapT(ui.x + (e.clientX - drag.cx) / ui.zx);
        var ra = Math.min(ui.range.a, ui.range.b), rb = Math.max(ui.range.a, ui.range.b);
        sel = song.tracks[drag.row].notes.filter(function (q) { return q.t >= ra && q.t < rb; });
    }
};

window.addEventListener("mousemove", function (e) {
    if (!drag) { return; }
    moves[drag.k](e, rollPos(e));
    dirty = true;
});

window.addEventListener("mouseup", function () {
    if (!drag) { return; }
    var d = drag;
    drag = null;
    ui.box = null;
    if ((d.k === "move" || d.k === "size") && d.moved) { commit(); }
    if (d.k === "size" && d.fresh && isVox(cur())) { openLyric(d.ref); }
    if (d.k === "erase" && d.hit) { commit(); }
    if (d.k === "ruler" && !d.moved) {
        ui.head = d.a;
        if (play.on) { startPlay(ui.head); }
    }
    if (d.k === "range" && ui.range.a === ui.range.b) { ui.range = null; }
    if (d.k === "key") { ui.hp = -1; }
    dirty = true;
});

var wheel = function (e, x0, roll) {
    var r = e.currentTarget.getBoundingClientRect();
    if (e.ctrlKey) {
        var mx = e.clientX - r.left - x0, at = ui.x + mx / ui.zx;
        ui.zx = clamp(ui.zx * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 0.2, 40);
        ui.x = Math.max(0, at - mx / ui.zx);
    } else if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        ui.x = Math.max(0, ui.x + (e.deltaX + (e.shiftKey ? e.deltaY : 0)) / ui.zx);
    } else if (roll && e.altKey) {
        var my = e.clientY - r.top, pAt = (my - RUL + ui.py) / ui.zy;
        ui.zy = clamp(ui.zy + (e.deltaY < 0 ? 1 : -1), 6, 30);
        ui.py = clampPy(pAt * ui.zy - (my - RUL));
    } else if (roll) {
        ui.py = clampPy(ui.py + e.deltaY);
    } else {
        return;
    }
    e.preventDefault();
    shutLyric(true);
    dirty = true;
};

cv.roll.addEventListener("wheel", function (e) { wheel(e, HEAD, true); }, { passive: false });
cv.lanes.addEventListener("wheel", function (e) { wheel(e, 0, false); }, { passive: false });
cv.ruler.addEventListener("wheel", function (e) { wheel(e, 0, false); }, { passive: false });


/* ---------- lyrics ---------- */

var lyr = { el: $("lyric"), n: null };

var neighbor = function (n, dir) {
    var list = cur().notes.slice().sort(byTime);
    return list[list.indexOf(n) + dir] || null;
};

var openLyric = function (n) {
    var el = lyr.el;
    var vis = (cv.roll.clientWidth - HEAD) / ui.zx;
    if (n.t < ui.x || n.t > ui.x + vis * 0.85) { ui.x = Math.max(0, n.t - vis * 0.2); }
    if (rollY(n.p) < RUL || rollY(n.p) > cv.roll.clientHeight - ui.zy) { ui.py = clampPy((127 - n.p) * ui.zy - (cv.roll.clientHeight - RUL) / 2); }
    lyr.n = n;
    sel = [n];
    el.style.left = tx(n.t, HEAD) + "px";
    el.style.top = (rollY(n.p) + ui.zy / 2 - 11) + "px";
    el.style.width = Math.max(84, n.l * ui.zx) + "px";
    el.value = n.w || "";
    el.classList.add("show");
    el.focus();
    el.select();
    dirty = true;
};

var splitWords = function (text) {
    var out = [];
    String(text).split(/\s+/).forEach(function (w) {
        var bits = w.split("-");
        bits.forEach(function (b, i) {
            if (b) { out.push(i < bits.length - 1 ? b + "-" : b); }
        });
    });
    return out;
};

var shutLyric = function (save) {
    if (!lyr.n) { return; }
    var n = lyr.n;
    lyr.n = null;
    lyr.el.classList.remove("show");
    dirty = true;
    if (!save) { return; }
    liveScrub(lyr.el, true);
    var words = splitWords(core.clean(lyr.el.value.trim()));
    var list = cur().notes.slice().sort(byTime);
    var at = list.indexOf(n);
    n.w = words[0] || "";
    for (var i = 1; i < words.length && at + i < list.length && !list[at + i].w; i++) { list[at + i].w = words[i]; }
    commit();
};

lyr.el.addEventListener("input", function () { liveScrub(lyr.el, false); });
lyr.el.addEventListener("blur", function () { shutLyric(true); });
lyr.el.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Enter" || e.key === "Escape") { shutLyric(e.key === "Enter"); }
    if (e.key !== "Tab") { return; }
    e.preventDefault();
    var n = lyr.n;
    shutLyric(true);
    var nx = n && neighbor(n, e.shiftKey ? -1 : 1);
    if (nx) { openLyric(nx); }
});


/* ---------- copy, paste and sections ---------- */

var copy = function () {
    if (sel.length) {
        var t0 = minOf(sel, "t");
        clip = { kind: "notes", notes: sel.map(function (n) { var c = copyNote(n); c.t -= t0; return c; }) };
    } else if (hasSec()) {
        clip = { kind: "sec", len: ui.hi - ui.lo, rows: song.tracks.map(function (tr) {
            return tr.notes.filter(inSec).map(function (n) { var c = copyNote(n); c.t -= ui.lo; return c; });
        }) };
    }
};

var paste = function (t) {
    if (!clip) { return; }
    var put = function (tr, list) {
        var made = list.map(function (c) { var n = copyNote(c); n.t += t; return n; });
        tr.notes = tr.notes.concat(made);
        return made;
    };
    if (clip.kind === "notes" && cur()) { sel = put(cur(), clip.notes); }
    if (clip.kind === "sec") {
        clip.rows.forEach(function (row, i) {
            if (song.tracks[i]) { put(song.tracks[i], row); }
        });
        sel = [];
        ui.lo = t;
        ui.hi = t + clip.len;
    }
    commit();
};

var wipe = function () {
    if (sel.length && cur()) {
        removeNotes(cur(), sel.slice());
    } else if (hasSec()) {
        song.tracks.forEach(function (tr) { tr.notes = tr.notes.filter(function (n) { return !inSec(n); }); });
    }
    commit();
};

var dup = function () {
    if (sel.length) {
        var span = Math.ceil((maxOf(sel.map(function (n) { return { e: n.t + n.l }; }), "e") - minOf(sel, "t")) / song.res) * song.res;
        var t0 = minOf(sel, "t");
        copy();
        paste(t0 + span);
    } else if (hasSec()) {
        copy();
        paste(ui.hi);
    }
};

var nudge = function (dt, dp) {
    if (!sel.length) { return; }
    dt = Math.max(dt, -minOf(sel, "t"));
    dp = clamp(dp, -minOf(sel, "p"), 127 - maxOf(sel, "p"));
    sel.forEach(function (n) {
        n.t += dt;
        n.p += dp;
    });
    if (sel.length === 1 && dp) { preview(cur().inst, sel[0].p, sel[0].w); }
    commit();
};

$("copyBtn").addEventListener("click", copy);
$("pasteBtn").addEventListener("click", function () { paste(snapT(ui.head)); });
$("dupBtn").addEventListener("click", dup);
$("delBtn").addEventListener("click", wipe);


/* ---------- keyboard ---------- */

window.addEventListener("keydown", function (e) {
    var a = document.activeElement;
    var tag = a ? a.tagName : "";
    if (stage) { return; }
    if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && a.type !== "range")) {
        if (e.key === "Escape" || (e.key === "Enter" && tag === "INPUT")) { a.blur(); }
        return;
    }
    if (!$("modal").classList.contains("hide")) {
        if (e.key === "Escape") { closeModal(); }
        return;
    }
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    var ctrl = e.ctrlKey || e.metaKey;
    var keys = {
        " ": toggle,
        Home: function () {
            if (play.on) { startPlay(0); }
            ui.head = ui.x = 0;
        },
        Delete: wipe,
        Backspace: wipe,
        Escape: function () {
            sel = [];
            ui.lo = ui.hi = 0;
            setLoop(false);
        },
        ArrowUp: function () { nudge(0, e.shiftKey ? 12 : 1); },
        ArrowDown: function () { nudge(0, e.shiftKey ? -12 : -1); },
        ArrowLeft: function () { nudge(-ui.snap, 0); },
        ArrowRight: function () { nudge(ui.snap, 0); },
        l: function () { setLoop(!ui.loop); },
        Enter: function () {
            if (sel.length === 1 && isVox(cur())) { openLyric(sel[0]); }
        }
    };
    var ctrlKeys = {
        z: e.shiftKey ? redo : undo,
        y: redo,
        c: copy,
        x: function () {
            copy();
            wipe();
        },
        v: function () { paste(snapT(ui.head)); },
        d: dup,
        a: function () { sel = cur() ? cur().notes.slice() : []; }
    };
    var fn = ctrl ? ctrlKeys[k] : keys[k];
    if (!fn) { return; }
    e.preventDefault();
    fn();
    dirty = true;
});

document.addEventListener("click", function (e) {
    if (e.target.tagName === "BUTTON") { e.target.blur(); }
});


/* ---------- dialogs ---------- */

var modal = function (o) {
    var area = $("mArea");
    $("mTitle").textContent = o.title;
    $("mText").innerHTML = o.html || "";
    area.style.display = o.area === undefined ? "none" : "";
    area.value = o.area || "";
    area.readOnly = !!o.ro;
    area.placeholder = o.ph || "";
    $("mBtns").innerHTML = "";
    o.btns.forEach(function (b) {
        var el = document.createElement("button");
        el.textContent = b.t;
        el.className = b.hi ? "hi" : "";
        el.addEventListener("click", function () { b.fn(el); });
        $("mBtns").appendChild(el);
    });
    $("modal").classList.remove("hide");
    if (!o.ro && o.area !== undefined) { area.focus(); }
};

var closeModal = function () { $("modal").classList.add("hide"); };

$("modal").addEventListener("mousedown", function (e) {
    if (e.target.id === "modal") { closeModal(); }
});

var copyText = function (el) {
    var done = function () {
        el.textContent = "Copied!";
        setTimeout(function () { el.textContent = "Copy"; }, 1300);
    };
    var area = $("mArea");
    var old = function () {
        area.select();
        document.execCommand("copy");
        done();
    };
    if (navigator.clipboard) {
        navigator.clipboard.writeText(area.value).then(done, old);
    } else {
        old();
    }
};

var size = function (n) {
    return n < 1024 ? n + " characters" : (n / 1024).toFixed(1) + "k characters";
};

/*
* Text and PJS exports share this dialog. Changing the visual updates the song and the text.
*/
var exportBox = function (kind) {
    var make = function () {
        var txt = core.encode(song);
        var code = kind === "pjs" ? pjs.build(song) : txt;
        var info = kind === "pjs" ?
            "Paste into a new Processing.js program on Khan Academy. <b>" + code.split("\n").length + " lines</b>, the song itself is " + size(txt.length) + "." :
            "<b>" + size(txt.length) + "</b>, lossless. Paste it into <b>var songText</b> in the HTML page, <b>var song</b> in a PJS program, or Import.";
        if (kind === "pjs" && pjs.hasVox(song)) { info += '<br><span class="warn">Vox tracks are not sung in the PJS version. Their lyrics still show as karaoke text.</span>'; }
        return { code: code, info: info };
    };
    var picks = core.visuals.map(function (v, i) {
        return '<option value="' + i + '"' + (i === (song.vis || 0) ? " selected" : "") + ">" + v + "</option>";
    }).join("");
    var first = make();
    modal({
        title: kind === "pjs" ? "Khan Academy program" : "Song text",
        html: '<label class="visPick">Visual <select id="visSel">' + picks + '</select></label><div id="expInfo">' + first.info + "</div>",
        area: first.code,
        ro: true,
        btns: [
            { t: "Copy", hi: true, fn: copyText },
            {
                t: "Preview",
                fn: function () {
                    closeModal();
                    openStage(core.encode(song), true);
                }
            },
            { t: "Close", fn: closeModal }
        ]
    });
    $("visSel").addEventListener("change", function () {
        song.vis = Number($("visSel").value);
        commit();
        var now = make();
        $("mArea").value = now.code;
        $("expInfo").innerHTML = now.info;
    });
};

$("expBtn").addEventListener("click", function () { exportBox("text"); });
$("pjsBtn").addEventListener("click", function () { exportBox("pjs"); });

$("impBtn").addEventListener("click", function () {
    modal({
        title: "Import song text",
        html: "Paste song text from Export Text, or a whole exported program.",
        area: "",
        ph: "Paste here...",
        btns: [
            {
                t: "Load",
                hi: true,
                fn: function () {
                    var raw = $("mArea").value.trim();
                    var m = raw.match(/var\s+song(?:Text)?\s*=\s*"([^"]*)"/);
                    try {
                        fresh(core.decode(m ? m[1] : raw));
                        closeModal();
                    } catch (er) {
                        $("mText").innerHTML = '<span class="warn">That text could not be read: ' + String(er) + "</span>";
                    }
                }
            },
            { t: "Cancel", fn: closeModal }
        ]
    });
});

var stored = function () {
    try {
        return localStorage.getItem(SAVE);
    } catch (er) {
        return null;
    }
};

$("saveBtn").addEventListener("click", function () {
    var has = !!stored();
    var btns = [{
        t: "Save here",
        hi: true,
        fn: function () {
            try {
                localStorage.setItem(SAVE, core.encode(song));
                $("mText").innerHTML = "<b>Saved.</b> Load it again from this same button.";
            } catch (er) {
                $("mText").innerHTML = '<span class="warn">This browser blocked saving. Use Export Text instead.</span>';
            }
        }
    }];
    if (has) {
        btns.push({
            t: "Load saved",
            fn: function () {
                try {
                    fresh(core.decode(stored()));
                    closeModal();
                } catch (er) {
                    $("mText").innerHTML = '<span class="warn">The saved song could not be read.</span>';
                }
            }
        });
        btns.push({
            t: "Delete saved",
            fn: function () {
                localStorage.removeItem(SAVE);
                $("mText").innerHTML = "Saved song deleted.";
            }
        });
    }
    btns.push({ t: "Close", fn: closeModal });
    modal({
        title: "Save in this browser",
        html: '<span class="warn">Before you save:</span> this keeps one song in this browser\'s local storage. ' +
            "It only stays on this device and browser, clearing your browsing data deletes it, saving again replaces it, " +
            "and other pages on the same site (like other Khan Academy programs) can read or overwrite it. " +
            "Nothing is stored unless you press Save here. For a copy you can't lose, use Export Text." +
            (has ? "<br><br>There is a saved song in this browser right now." : ""),
        btns: btns
    });
});

$("lyrBtn").addEventListener("click", function () {
    var tr = cur();
    if (!isVox(tr)) { return; }
    modal({
        title: "Fill lyrics",
        html: "Each word lands on the next note" + (sel.length ? " of your selection" : " from the first note") + ". Split syllables with a hyphen, like <b>hel-lo</b>. A lone <b>-</b> holds the last vowel.",
        area: "",
        ph: "hel-lo world this is my song",
        btns: [
            {
                t: "Fill",
                hi: true,
                fn: function () {
                    liveScrub($("mArea"), true);
                    var words = splitWords(core.clean($("mArea").value));
                    var list = (sel.length ? sel.slice() : tr.notes.slice()).sort(byTime);
                    words.forEach(function (w, i) {
                        if (list[i]) { list[i].w = w; }
                    });
                    commit();
                    closeModal();
                }
            },
            { t: "Cancel", fn: closeModal }
        ]
    });
});

$("mArea").addEventListener("input", function () {
    if ($("mTitle").textContent === "Fill lyrics") { liveScrub($("mArea"), false); }
});

$("newBtn").addEventListener("click", function () {
    modal({
        title: "Start a new song?",
        html: "The board is cleared. Undo can still bring it back.",
        btns: [
            {
                t: "New song",
                hi: true,
                fn: function () {
                    fresh({ title: "", bpm: 120, res: core.res, vis: 1, tracks: [{ inst: 0, name: "Piano", vol: 75, pan: 0, mute: false, solo: false, notes: [] }] });
                    closeModal();
                }
            },
            { t: "Cancel", fn: closeModal }
        ]
    });
});


/* ---------- player stage ---------- */

var openStage = function (text, back) {
    stopPlay();
    shutLyric(true);
    $("stage").classList.remove("hide");
    $("stageBtn").textContent = back ? "Back to editor" : "Open in editor";
    stage = pjs.run($("stageCv"), text);
};

$("stageBtn").addEventListener("click", function () {
    if (stage) { stage(); }
    stage = null;
    $("stage").classList.add("hide");
    dirty = true;
});


/* ---------- top bar ---------- */

$("playBtn").addEventListener("click", toggle);
$("loopBtn").addEventListener("click", function () { setLoop(!ui.loop); });
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);
$("addBtn").addEventListener("click", function () { addTrack(ui.brush); });
$("sideAdd").addEventListener("click", function () {
    addTrack(ui.brush);
    if (single()) { setView("notes"); }
});


/* ---------- single view and full window ---------- */

var single = function () { return document.body.classList.contains("single"); };

var setView = function (v) {
    document.body.dataset.view = v;
    $("viewSel").value = v;
    shutLyric(true);
    dirty = true;
};

var layout = function () {
    var small = window.innerWidth < SMALL_W || window.innerHeight < SMALL_H;
    document.body.classList.toggle("single", small);
    if (!small) { document.body.classList.remove("menu"); }
    HEAD = small ? 64 : 200;
    dirty = true;
};

$("viewSel").addEventListener("change", function () { setView($("viewSel").value); });
$("trackSel").addEventListener("change", function () { setCur(Number($("trackSel").value)); });
$("menuBtn").addEventListener("click", function () { document.body.classList.toggle("menu"); });
document.addEventListener("mousedown", function (e) {
    if (single() && !e.target.closest("#more") && !e.target.closest("#menuBtn")) { document.body.classList.remove("menu"); }
});
window.addEventListener("resize", layout);

/*
* Full window: writes a fresh copy of this page into a new window, carrying the current song.
*/
var fullPage = function () {
    var page = document.documentElement.cloneNode(true);
    var body = page.querySelector("body");
    page.querySelectorAll("[data-dyn]").forEach(function (el) { el.remove(); });
    ["pal", "heads", "mBtns", "trackSel"].forEach(function (id) { page.querySelector("#" + id).innerHTML = ""; });
    ["arr", "lanes"].forEach(function (id) { page.querySelector("#" + id).removeAttribute("style"); });
    ["stage", "modal"].forEach(function (id) { page.querySelector("#" + id).className = "hide"; });
    body.removeAttribute("class");
    body.removeAttribute("data-view");
    page.querySelector("#songScript").textContent = "\nvar songText = \"" + core.encode(song) + "\";\nvar popped = true;\n";
    return "<!DOCTYPE html>" + page.outerHTML;
};

$("fullBtn").addEventListener("click", function () {
    var html = fullPage();
    stopPlay();
    var w = window.open();
    if (!w) { return; }
    w.document.write(html);
    w.document.close();
});

$("homeBtn").addEventListener("click", function () {
    if (play.on) { startPlay(0); }
    ui.head = ui.x = 0;
    dirty = true;
});

$("followBtn").addEventListener("click", function () {
    ui.follow = !ui.follow;
    $("followBtn").classList.toggle("on", ui.follow);
});

$("bpm").addEventListener("change", function () {
    song.bpm = clamp(Math.round(Number($("bpm").value)) || 120, 20, 400);
    $("bpm").value = song.bpm;
    if (play.on) { startPlay(nowTick()); }
    commit();
});

$("snap").addEventListener("change", function () {
    ui.snap = Number($("snap").value);
    dirty = true;
});

$("title").addEventListener("input", function () { liveScrub($("title"), false); });
$("title").addEventListener("change", function () {
    liveScrub($("title"), true);
    song.title = $("title").value = core.clean($("title").value.trim());
    commit();
});

$("vel").addEventListener("input", function () {
    ui.vel = Number($("vel").value);
    sel.forEach(function (n) { n.v = ui.vel; });
    dirty = true;
});

$("vel").addEventListener("change", function () {
    if (sel.length) { commit(); }
});


/* ---------- start up ---------- */

(function () {
    var text = typeof songText === "string" ? songText : "";
    document.body.dataset.view = "tracks";
    layout();
    if (window.popped) { $("fullBtn").style.display = "none"; }
    var blank = { title: "", bpm: 120, res: core.res, vis: 1, tracks: [{ inst: 0, name: "Piano", vol: 75, pan: 0, mute: false, solo: false, notes: [] }] };
    core.setup(sfx);
    try {
        load(text ? core.decode(text) : blank, 0);
    } catch (er) {
        console.warn("songText could not be read", er);
        load(blank, 0);
    }
    hist = [{ s: core.encode(song), c: 0 }];
    hpos = 0;
    var ro = new ResizeObserver(function () { dirty = true; });
    [cv.roll, cv.ruler, $("arrBody")].forEach(function (el) { ro.observe(el); });
    requestAnimationFrame(frame);
    if (text && song.vis && !window.popped) {
        voiceReady(function () { openStage(text, false); });
    }
})();
        </script>
